syntax = "proto3";

package coordinode.internode.routing;

// Whole commands carried from the member a client reached (the ingress) to
// the member that executes them: an autonomous statement, or a step of an
// interactive transaction at the leader, which alone holds open
// transactions. The executing member
// selects the view, evaluates, validates and commits; the ingress never
// ships a write set it evaluated itself.
//
// Served only on the inter-node channel, to admitted members of the same
// deployment; a client credential never reaches it, and an admitted member
// is not by that alone allowed to act as any caller: each command names the
// caller its ingress verified. A call is never forwarded again: a member that
// cannot run it answers with a refusal naming the leader it knows of, and
// the ingress decides whether to try once more.
//
// Values (parameters and rows) travel in the engine's own encoding,
// MessagePack of its value type: both members run the same version, which
// the version handshake establishes before any call here.
//
// A command that ran and failed answers in the message body with its
// RoutedError, never with a gRPC status: a status from this service means
// the command did not run (refused before it was read, its
// `cn-routing-refused` response metadata says why) or that its answer was
// lost. Every request carries the version of the RoutedError encoding the
// ingress reads in its `cn-routed-error-codec` metadata (a decimal number);
// a member with another one refuses the call before reading it.
service CommandRoutingService {
  // Run one statement at the member that executes it and stream its answer:
  // for a statement of a transaction, `admitted` once it has its place behind
  // the commands admitted before it; then its columns, row batches, and the
  // statistics that end it, or the error that ends it, as many events per
  // frame as were ready together. An
  // ingress that leaves before the whole answer reached it aborts the
  // transaction the statement ran in: its client cannot know what the
  // statement did.
  rpc Execute(RoutedStatement) returns (stream RoutedStatementFrame);

  // Open an interactive transaction at the leader under the ID the client
  // drew.
  rpc Begin(RoutedBegin) returns (RoutedBegun);

  // Commit an interactive transaction at the leader.
  rpc Commit(RoutedCommit) returns (RoutedCommitted);

  // Roll back an interactive transaction at the leader.
  rpc Rollback(RoutedRollback) returns (RoutedRolledBack);

  // Enroll an issuer, resolve an operation, or release or retire operation
  // records at the leader, which decides them through the group's log.
  rpc Operation(RoutedOperation) returns (RoutedOperationAnswer);
}

// Who a routed command acts for, as the ingress's authentication or its
// trusted host established it. Never taken from a client's request fields.
message ActingContext {
  oneof context {
    // Every caller shares one trust boundary: an embedding host's own access,
    // or a deployment configured without principals. No caller isolation.
    Trusted trusted = 1;
    // A verified principal.
    Principal principal = 2;
  }
}

// The single-trust access mode; carries nothing.
message Trusted {}

// A verified subject and the scope it acts in.
message Principal {
  // The stable subject, as its issuer names it.
  string subject = 1;
  // The issuer or trust scope the subject belongs to.
  string trust_scope = 2;
  // The namespace the caller is bound to.
  string namespace = 3;
}

// The settings a statement runs under, as the statement, its session and the
// ingress's defaults named them. A setting left unset here takes the
// executing member's own.
message RoutedSettings {
  // Read concern level, numbered as coordinode.v1.replication.ReadConcernLevel
  // (1 local, 2 majority, 3 linearizable, 4 snapshot); zero takes the
  // executing member's default.
  uint32 read_concern_level = 1;
  // Log index the read waits for; zero waits for none.
  uint64 after_index = 2;
  // Timestamp a snapshot read is pinned to; zero pins none.
  uint64 at_timestamp = 3;
  // When a write is acknowledged; absent takes the executing member's
  // default.
  RoutedWriteConcern write_concern = 4;
  // Vector consistency, numbered as coordinode.v1.replication.VectorConsistency;
  // zero leaves it to what the read concern implies.
  uint32 vector_consistency = 5;
  // How long the statement waits for a vector index still being built, in
  // milliseconds; absent takes the executing member's setting.
  optional uint64 vector_build_wait_ms = 6;
  // Memory limit of the statement in bytes; absent takes the executing
  // member's setting.
  optional uint64 query_memory_limit = 7;
}

// When a write is acknowledged.
message RoutedWriteConcern {
  // Members that must hold the write, the leader included, when `majority`
  // is false; zero answers without waiting for any.
  uint32 acks = 1;
  // A majority of the group must hold the write; `acks` is then unused.
  bool majority = 2;
  // The state each counted member holds the write in, numbered as
  // coordinode.v1.replication.Journal (1 journal, 2 cache, 3 memory).
  uint32 journal = 3;
  // Milliseconds to wait for the counted members; zero waits without bound.
  uint32 timeout_ms = 4;
}

// One statement to run at the member that executes it.
message RoutedStatement {
  // Who the statement acts for.
  ActingContext actor = 1;
  // The statement's text.
  string query = 2;
  // Its parameters, a map from name to value in the engine's encoding;
  // empty for none.
  bytes parameters = 3;
  // The settings it runs under.
  RoutedSettings settings = 4;
  // The ID of the interactive transaction it runs in, as the client drew it
  // (16 bytes); empty for a statement that commits on its own.
  bytes transaction_id = 5;
  // The client operation an autonomous statement carries out, in the
  // descriptor's byte form; empty for none.
  bytes operation = 7;
  // What is left of the caller's deadline, in milliseconds; zero for none.
  uint64 deadline_ms = 8;
  // Where in the client's code the statement was issued, for the executing
  // member's advisor; absent when the client sent none.
  SourceLocation source = 9;
  // Present on the first statement of a transaction: the transaction opens
  // with these settings under `transaction_id`, and the statement runs in it,
  // in the one call; no separate Begin travels first. A start naming an open
  // ID is refused before the statement runs.
  RoutedStart start = 10;
}

// How the command that starts a transaction opens it.
message RoutedStart {
  // Its read concern level and write concern, fixed for its life; the read
  // position fields are unused.
  RoutedSettings settings = 1;
  // What ends it when it stays idle past the idle timeout: 1 rolls it back,
  // 2 commits it; zero takes the executing member's setting.
  uint32 timeout_outcome = 2;
  // The client operation its commit carries out, in the descriptor's byte
  // form; empty for none. Required to commit it at idle expiry.
  bytes operation = 3;
}

// A place in a client's code, with the application that named it.
message SourceLocation {
  // Source file path as the client knows it.
  string file = 1;
  // Line number in that file.
  uint32 line = 2;
  // Enclosing function; empty when the client could not tell.
  string function = 3;
  // The client application's name; empty when it named none.
  string app = 4;
  // The client application's version; empty when it named none.
  string version = 5;
}

// The events of a routed statement's answer that were ready together, in
// order: an answer that fits one batch travels as one message.
message RoutedStatementFrame {
  repeated RoutedStatementEvent events = 1;
}

// One event of a routed statement's answer.
message RoutedStatementEvent {
  oneof event {
    // A statement of a transaction has its place; the ingress may pass the
    // next command of the same transaction on. A statement that commits on
    // its own waits behind nothing and is answered without it.
    Admitted admitted = 1;
    // The result's column names, before its first rows.
    Columns columns = 2;
    // A batch of rows, each a list of values in the engine's encoding.
    bytes rows = 3;
    // The statistics that end the answer.
    RoutedStats end = 4;
    // The failure that ends the answer: a RoutedError in its protobuf
    // encoding, at most 64 KiB. Rows sent before it are not a result.
    bytes error = 5;
  }
}

// Carries nothing: the event is the signal.
message Admitted {}

// A result's column names, in order.
message Columns {
  repeated string names = 1;
}

// What a finished statement reports.
message RoutedStats {
  int64 nodes_created = 1;
  int64 nodes_deleted = 2;
  int64 edges_created = 3;
  int64 edges_deleted = 4;
  int64 properties_set = 5;
  // Log index the statement's own commit was applied at; zero for none.
  uint64 applied_index = 6;
  // Timestamp the statement's own commit landed at; zero for none.
  uint64 commit_ts = 7;
  // Log index the read was served at on the executing member.
  uint64 read_index = 8;
  // What a read on a read-only member is as of; zero otherwise.
  uint64 read_as_of_ts = 9;
}

// Open an interactive transaction.
message RoutedBegin {
  // The ID the client drew for it, 16 bytes.
  bytes transaction_id = 5;
  // Who the transaction acts for; every later command must act for the same.
  ActingContext actor = 1;
  // Its read concern level and write concern, fixed for its life; the read
  // position fields are unused.
  RoutedSettings settings = 2;
  // What ends it when it stays idle past the idle timeout: 1 rolls it back,
  // 2 commits it; zero takes the executing member's setting.
  uint32 timeout_outcome = 3;
  // The client operation its commit carries out, in the descriptor's byte
  // form; empty for none. Required to commit it at idle expiry.
  bytes operation = 4;
}

// Whether the transaction is open.
message RoutedBegun {
  // Empty when the transaction is open; otherwise why it was not opened, a
  // RoutedError in its protobuf encoding, at most 64 KiB.
  bytes error = 1;
}

// Commit an interactive transaction.
message RoutedCommit {
  // Who the commit acts for.
  ActingContext actor = 1;
  // The transaction's ID, 16 bytes.
  bytes transaction_id = 2;
  // The client operation the commit carries out, in the descriptor's byte
  // form; empty for the one its begin named, or none.
  bytes operation = 4;
  // What is left of the caller's deadline, in milliseconds; zero for none.
  uint64 deadline_ms = 5;
  // The node versions the caller built its statements on: a node at another
  // version refuses the whole commit.
  repeated RoutedExpectation expect = 6;
}

// A node and the version a caller believes it is at.
message RoutedExpectation {
  // The node's id.
  uint64 node_id = 1;
  // The version read earlier; absent requires the node not to exist.
  optional uint64 version = 2;
}

// The commit's receipt, or why it failed.
message RoutedCommitted {
  // Timestamp every write of the transaction landed at; unset when `error`
  // is set.
  uint64 commit_ts = 1;
  // Log index the commit was applied at; zero when it reported none.
  uint64 applied_index = 2;
  // Empty when the commit succeeded; otherwise how it failed, a RoutedError
  // in its protobuf encoding, at most 64 KiB.
  bytes error = 3;
}

// Roll back an interactive transaction.
message RoutedRollback {
  // Who the rollback acts for.
  ActingContext actor = 1;
  // The transaction's ID, 16 bytes.
  bytes transaction_id = 2;
  // The client did not ask for it: the stream a statement of the
  // transaction ran on was lost, so the transaction is aborted and later
  // commands for it are told so.
  bool abandoned = 3;
}

// Whether the rollback is done.
message RoutedRolledBack {
  // Empty when the rollback is done; otherwise why it was refused, a
  // RoutedError in its protobuf encoding, at most 64 KiB.
  bytes error = 1;
}

// One call on the records of client operations.
message RoutedOperation {
  // Who the call acts for.
  ActingContext actor = 1;
  oneof call {
    // Enroll a new incarnation of this issuer, its 16 bytes.
    bytes enroll = 2;
    // Resolve an operation's outcome.
    RoutedResolve resolve = 3;
    // Release the outcomes of these settled operations.
    RoutedOperations acknowledge = 4;
    // Retire the operations of this descriptor's incarnation numbered below
    // its sequence, in the descriptor's byte form.
    bytes retire = 5;
  }
}

// Resolve one operation.
message RoutedResolve {
  // The operation, in the descriptor's byte form.
  bytes operation = 1;
  // Exclude it through the log when nothing is recorded of it, so the answer
  // is final.
  bool exclude = 2;
}

// Several operations.
message RoutedOperations {
  // Each in the descriptor's byte form.
  repeated bytes operations = 1;
}

// The answer to a call on operation records.
message RoutedOperationAnswer {
  oneof answer {
    // The incarnation an enrollment opened.
    RoutedEnrolled enrolled = 1;
    // How a resolved operation stands.
    RoutedOutcome outcome = 2;
    // A release or retirement is done.
    RoutedDone done = 3;
    // The call failed: a RoutedError in its protobuf encoding, at most
    // 64 KiB.
    bytes error = 4;
  }
}

// An enrolled incarnation.
message RoutedEnrolled {
  // Its number.
  uint64 incarnation = 1;
  // The first operation number it hands out.
  uint64 next_sequence = 2;
  // The deployment that enrolled it, 16 bytes.
  bytes deployment = 3;
}

// How an operation stands.
message RoutedOutcome {
  RoutedOperationState state = 1;
  // The attempt that committed; zero unless committed.
  uint64 attempt = 2;
  // Its commit timestamp; zero unless committed.
  uint64 commit_ts = 3;
}

// The states an operation is in.
enum RoutedOperationState {
  ROUTED_OPERATION_STATE_UNSPECIFIED = 0;
  // An attempt of it committed.
  ROUTED_OPERATION_STATE_COMMITTED = 1;
  // It is proven never to take effect.
  ROUTED_OPERATION_STATE_ABORTED = 2;
  // Nothing is recorded of it.
  ROUTED_OPERATION_STATE_UNKNOWN = 3;
  // Its record is released.
  ROUTED_OPERATION_STATE_RETIRED = 4;
}

// Carries nothing: the call is done.
message RoutedDone {}

// A command's failure at the member that ran it, in the database library's
// error contract: one case per kind of failure, each with every field a
// caller decides on, so an ingress reports the same failure its own member
// would. The engine's error objects and their sources stay on the member that
// raised them. A receiver that meets a case or a value it does not know reads
// the answer as lost, never as a refusal it guesses at.
message RoutedError {
  oneof kind {
    // The statement is not valid Cypher.
    ParseFailure parse = 1;
    // No plan answers the statement.
    Text plan = 2;
    // The statement is not meaningful as written.
    Text semantic = 3;
    // A session SET named a value its setting cannot take.
    SettingRefused session_setting = 4;
    // Arithmetic with no answer, or a call of an unknown function.
    ArithmeticFailure arithmetic = 5;
    // A CALL refused before the procedure ran.
    ProcedureRefused procedure = 6;
    // The statement asks for something the engine does not do.
    Text unsupported = 7;
    // The statement spent its memory limit or deadline, or was cancelled.
    BudgetSpent budget = 8;
    // An index cannot answer and the fallback would run outside the budget.
    IndexUnresolved index_unresolved = 9;
    // Triggers fired in a chain deeper than its limit.
    CascadeOverflow cascade_overflow = 10;
    // One trigger fired more often within one cascade than it allows.
    CascadeFanoutOverflow cascade_fanout_overflow = 11;
    // A STRICT label refused a property, or a write set a computed one.
    Text schema_violation = 12;
    // An insert named a key a row already holds.
    DuplicateKey duplicate_key = 13;
    // A write would give a unique value a second holder.
    UniqueViolation unique_violation = 14;
    // A unique index still being built cannot prove a value free.
    UniquenessUnresolved uniqueness_unresolved = 15;
    // A write would break a constraint of its label.
    ConstraintViolation constraint_violation = 16;
    // A statement tried to change the key of a row.
    KeyImmutable key_immutable = 17;
    // A catalog object of the name exists already.
    CatalogName catalog_object_exists = 18;
    // A catalog object exists with another definition.
    CatalogObjectDiffers catalog_object_differs = 19;
    // A catalog change named a revision the object is not at.
    CatalogRevisionMismatch catalog_revision_mismatch = 20;
    // No catalog object of the name exists.
    CatalogName catalog_object_missing = 21;
    // The catalog refuses the change in its current state.
    Text catalog_refused = 22;
    // No transaction this caller may use is held under the ID.
    TransactionRef unknown_transaction = 23;
    // A transaction is open, or recently ended, under the ID.
    TransactionRef transaction_id_in_use = 24;
    // The transaction has too many commands waiting.
    TransactionRef transaction_busy = 25;
    // A transaction that commits at idle expiry named no operation.
    TransactionRef operation_required = 26;
    // The commit names another operation than the transaction's start.
    TransactionRef operation_differs = 27;
    // The transaction was committed at idle expiry.
    TransactionRef committed_on_timeout = 28;
    // The commit made at idle expiry has an unknown outcome.
    TransactionRef outcome_unknown = 29;
    // The transaction ended with nothing of it applied.
    TransactionAborted transaction_aborted = 30;
    // OCC validation refused the write.
    TransactionConflict transaction_conflict = 31;
    // A declared condition refused the write.
    InvariantRefused invariant_refused = 32;
    // A conditioned write found another version of its record.
    RevisionMismatch revision_mismatch = 33;
    // The transaction buffered more than it may.
    TransactionTooLarge transaction_too_large = 34;
    // Storage sheds writes until compaction catches up.
    Empty write_backpressure = 35;
    // A storage endpoint is at its hard capacity limit.
    CapacityExhausted capacity_exhausted = 36;
    // A filesystem is below its free-space reserve.
    StorageFull storage_full = 37;
    // The member does not lead.
    NotLeader not_leader = 38;
    // The member does not run its group's version and is read-only.
    MemberReadOnly member_read_only = 39;
    // A read below the MVCC retention horizon.
    OutsideRetention outside_retention = 40;
    // A snapshot read whose commits have not landed yet.
    ReadNotReady read_not_ready = 41;
    // The client operation stands already; this attempt applied nothing.
    OperationSettled operation_settled = 42;
    // The operation belongs to another deployment.
    ForeignOperation foreign_operation = 43;
    // A storage failure no case above classifies.
    Text storage = 44;
    // A failure inside the database no case above classifies.
    Text other = 45;
    // The statement's settings cannot be served together.
    Text settings_refused = 46;
    // The read could not be placed or fenced as its settings ask.
    ReadFence read_fence = 47;
    // The member's error could not be carried: its fields a caller decides
    // on do not fit the 64 KiB bound. Not a refusal: the receiver reads it as
    // an answer it could not read, whatever the command did.
    Undeliverable undeliverable = 48;
  }
}

// An error too large to carry.
message Undeliverable {
  // The kind of error it was, for the receiver's log.
  string variant = 1;
  // The bytes its encoding would have taken.
  uint64 size = 2;
}

// A read that could not be fenced.
message ReadFence {
  ReadFenceKind kind = 1;
  // The fence's account of it.
  string message = 2;
}

// What stood in the way of a read fence.
enum ReadFenceKind {
  READ_FENCE_KIND_UNSPECIFIED = 0;
  // The member's role does not serve the read preference or concern.
  READ_FENCE_KIND_ROLE = 1;
  // The member lags too far behind.
  READ_FENCE_KIND_STALE = 2;
  // The fence did not reach its position or lease in time.
  READ_FENCE_KIND_TIMEOUT = 3;
}

// Carries nothing: the case is the whole failure.
message Empty {}

// A failure that is its text.
message Text {
  // What failed, for a person to read; possibly cut short at 8 KiB.
  string message = 1;
}

// Why a statement is not valid Cypher.
message ParseFailure {
  oneof failure {
    // The grammar refused it.
    SyntaxError syntax = 1;
    // It parsed, but cannot be built into a query; the text says why.
    string invalid = 2;
  }
}

// Where and why the grammar refused a statement.
message SyntaxError {
  // What the grammar expected; possibly cut short at 8 KiB.
  string message = 1;
  // Byte offset of the start of the error in the statement.
  uint64 start = 2;
  // Byte offset of its end.
  uint64 end = 3;
  // Line number, from 1.
  uint64 line = 4;
  // Column number, from 1.
  uint64 column = 5;
}

// A session setting and why its value was refused.
message SettingRefused {
  // The setting named.
  string setting = 1;
  // Why the value was refused.
  string reason = 2;
}

// Arithmetic with no answer.
message ArithmeticFailure {
  oneof failure {
    // A call of a function nothing provides: its name.
    string unknown_function = 1;
    // Division or modulo by an integer zero.
    Empty divide_by_zero = 2;
    // An integer result outside the 64-bit range.
    Empty long_overflow = 3;
  }
}

// A CALL refused before the procedure ran. The fields a kind does not name
// are empty or zero.
message ProcedureRefused {
  ProcedureRefusal kind = 1;
  // The procedure the call named.
  string procedure = 2;
  // The argument refused (missing, of the wrong type, or of an unusable
  // value).
  string argument = 3;
  // The output column the call yielded and the procedure lacks.
  string column = 4;
  // The type the argument must have.
  string expected = 5;
  // The type, or for an output shape the width, that was found.
  string found = 6;
  // Why an argument's value is refused.
  string reason = 7;
  // How many inputs or outputs the procedure declares.
  uint64 declared = 8;
  // How many arguments the call passed, or values the procedure returned.
  uint64 given = 9;
}

// The kinds of a refused procedure call.
enum ProcedureRefusal {
  PROCEDURE_REFUSAL_UNSPECIFIED = 0;
  // No procedure has the name.
  PROCEDURE_REFUSAL_UNKNOWN = 1;
  // More arguments than the procedure declares.
  PROCEDURE_REFUSAL_TOO_MANY_ARGUMENTS = 2;
  // A required argument left out.
  PROCEDURE_REFUSAL_MISSING_ARGUMENT = 3;
  // An argument of the wrong type.
  PROCEDURE_REFUSAL_ARGUMENT_TYPE = 4;
  // An argument whose value the procedure cannot use.
  PROCEDURE_REFUSAL_INVALID_ARGUMENT = 5;
  // A YIELD of a column the procedure does not produce.
  PROCEDURE_REFUSAL_UNKNOWN_OUTPUT = 6;
  // A CALL inside a larger query that yields nothing.
  PROCEDURE_REFUSAL_YIELD_REQUIRED = 7;
  // The procedure returned a row of the wrong width.
  PROCEDURE_REFUSAL_OUTPUT_SHAPE = 8;
  // A second procedure registered under a taken name.
  PROCEDURE_REFUSAL_DUPLICATE_NAME = 9;
}

// What stopped a statement.
message BudgetSpent {
  oneof stop {
    // Its memory limit.
    MemoryBudget memory = 1;
    // Its deadline.
    Empty deadline = 2;
    // A cancellation.
    Empty cancelled = 3;
  }
}

// A memory reservation refused.
message MemoryBudget {
  // Bytes the refused reservation asked for.
  uint64 requested = 1;
  // Bytes reserved when it was refused.
  uint64 used = 2;
  // The statement's memory limit in bytes.
  uint64 limit = 3;
}

// An index that cannot answer.
message IndexUnresolved {
  // The indexed label.
  string label = 1;
  // The indexed property.
  string property = 2;
  // The operator that would have run outside the budget.
  string operator = 3;
}

// A trigger chain deeper than its limit.
message CascadeOverflow {
  // The depth reached.
  uint32 current = 1;
  // The limit.
  uint32 limit = 2;
  // The triggers that fired, in firing order.
  repeated string chain = 3;
}

// A trigger that fired too often within one cascade.
message CascadeFanoutOverflow {
  // The trigger.
  string trigger = 1;
  // How often it fired.
  uint32 count = 2;
  // The limit.
  uint32 limit = 3;
}

// A key a row of the table already holds.
message DuplicateKey {
  // The table.
  string table = 1;
  // The key, rendered, whole.
  string key = 2;
  // The elementId of the row that holds it.
  string element_id = 3;
}

// A unique value with a holder already.
message UniqueViolation {
  // The unique index.
  string index = 1;
  // The indexed properties, comma-separated.
  string property = 2;
  // The value, rendered, whole.
  string value = 3;
  // The elementId of the node that holds it.
  string element_id = 4;
}

// A unique index that cannot prove a value free yet.
message UniquenessUnresolved {
  // The index being built.
  string index = 1;
  // The most stored node rows one proof reads.
  uint64 limit = 2;
}

// A node that would break a constraint of its label.
message ConstraintViolation {
  // The constraint.
  string constraint = 1;
  // What it requires.
  RoutedConstraintKind kind = 2;
  // The constrained label.
  string label = 3;
  // The property that breaks it.
  string property = 4;
  // The elementId of the node.
  string element_id = 5;
}

// What a constraint requires.
message RoutedConstraintKind {
  // Exactly one is set; none set is unreadable.
  oneof kind {
    // No two nodes share the values; a node missing any of them is not
    // constrained.
    RoutedNothing unique = 1;
    // The property is present and not null.
    RoutedNothing not_null = 2;
    // Every property is present and not null, and no two nodes share the
    // values.
    RoutedNothing node_key = 3;
    // A present, non-null value has this type.
    RoutedPropertyType type = 4;
  }
}

// A case that carries nothing beyond being named.
message RoutedNothing {}

// A declared property type, flat: `array_depth` arrays around a base type
// that is not an array. Flat so a reader bounds the nesting by one number
// before building anything, with no recursion; a depth past the engine's
// bound is unreadable.
message RoutedPropertyType {
  // How many arrays wrap the base type; 0 for the base type itself.
  uint32 array_depth = 1;
  // The base type; exactly one is set.
  oneof base {
    // A type that takes no parameters.
    RoutedScalarType scalar = 2;
    // A fixed-dimension vector.
    RoutedVectorType vector = 3;
    // A value evaluated at query time.
    RoutedComputedSpec computed = 4;
  }
}

// The property types that take no parameters.
enum RoutedScalarType {
  // Not a type; unreadable.
  ROUTED_SCALAR_TYPE_UNSPECIFIED = 0;
  // UTF-8 text.
  ROUTED_SCALAR_TYPE_STRING = 1;
  // 64-bit signed integer.
  ROUTED_SCALAR_TYPE_INT = 2;
  // 64-bit float.
  ROUTED_SCALAR_TYPE_FLOAT = 3;
  // Boolean.
  ROUTED_SCALAR_TYPE_BOOL = 4;
  // Timestamp.
  ROUTED_SCALAR_TYPE_TIMESTAMP = 5;
  // A value held in the blob store.
  ROUTED_SCALAR_TYPE_BLOB = 6;
  // A map of named values.
  ROUTED_SCALAR_TYPE_MAP = 7;
  // A geographic point.
  ROUTED_SCALAR_TYPE_GEO = 8;
  // Raw bytes.
  ROUTED_SCALAR_TYPE_BINARY = 9;
  // An arbitrary nested document.
  ROUTED_SCALAR_TYPE_DOCUMENT = 10;
}

// A vector type.
message RoutedVectorType {
  // Its number of dimensions.
  uint32 dimensions = 1;
  // How distance between two vectors is measured.
  RoutedVectorMetric metric = 2;
}

// Distance metrics of a vector type.
enum RoutedVectorMetric {
  // Not a metric; unreadable.
  ROUTED_VECTOR_METRIC_UNSPECIFIED = 0;
  // Cosine distance.
  ROUTED_VECTOR_METRIC_COSINE = 1;
  // Euclidean distance.
  ROUTED_VECTOR_METRIC_L2 = 2;
  // Negated dot product.
  ROUTED_VECTOR_METRIC_DOT_PRODUCT = 3;
  // Manhattan distance.
  ROUTED_VECTOR_METRIC_L1 = 4;
}

// How a computed property is evaluated at query time.
message RoutedComputedSpec {
  // Exactly one is set; none set is unreadable.
  oneof spec {
    // A value interpolated from `initial` to `target` over the duration.
    RoutedDecay decay = 1;
    // Seconds left before the node or its content is deleted.
    RoutedTtl ttl = 2;
    // A multiplier applied to vector similarity scores.
    RoutedVectorDecay vector_decay = 3;
  }
}

// A decaying value.
message RoutedDecay {
  // How the weight falls over the duration.
  RoutedDecayFormula formula = 1;
  // The value when no time has passed.
  double initial = 2;
  // The value once the duration has passed.
  double target = 3;
  // The duration, in seconds.
  uint64 duration_secs = 4;
  // The TIMESTAMP property elapsed time is measured from.
  string anchor_field = 5;
}

// A countdown to deletion.
message RoutedTtl {
  // The duration before expiry, in seconds.
  uint64 duration_secs = 1;
  // The TIMESTAMP property elapsed time is measured from.
  string anchor_field = 2;
  // What expiry deletes.
  RoutedTtlScope scope = 3;
  // For a subtree scope, the DOCUMENT property deleted; unset deletes the
  // anchor field itself.
  optional string target_field = 4;
}

// What an expired TTL deletes.
enum RoutedTtlScope {
  // Not a scope; unreadable.
  ROUTED_TTL_SCOPE_UNSPECIFIED = 0;
  // The property alone.
  ROUTED_TTL_SCOPE_FIELD = 1;
  // A DOCUMENT property and everything in it.
  ROUTED_TTL_SCOPE_SUBTREE = 2;
  // The node and its edges.
  ROUTED_TTL_SCOPE_NODE = 3;
}

// A decaying multiplier of vector similarity.
message RoutedVectorDecay {
  // How the weight falls over the duration.
  RoutedDecayFormula formula = 1;
  // The duration, in seconds.
  uint64 duration_secs = 2;
  // The TIMESTAMP property elapsed time is measured from.
  string anchor_field = 3;
}

// How a decay weight falls from 1 to 0 over normalized time t in [0, 1].
message RoutedDecayFormula {
  // Exactly one is set; none set is unreadable.
  oneof formula {
    // 1 - t.
    RoutedNothing linear = 1;
    // e^(-lambda * t).
    double exponential_lambda = 2;
    // (1 + t / tau)^(-alpha).
    RoutedPowerLaw power_law = 3;
    // 1 before the duration ends, 0 after.
    RoutedNothing step = 4;
  }
}

// The parameters of a power-law decay.
message RoutedPowerLaw {
  // Time scale, as a fraction of the duration.
  double tau = 1;
  // Decay exponent.
  double alpha = 2;
}

// A key column a statement tried to change.
message KeyImmutable {
  // The table.
  string table = 1;
  // The key column.
  string column = 2;
}

// The kinds of catalog objects.
enum CatalogObjectKind {
  CATALOG_OBJECT_KIND_UNSPECIFIED = 0;
  CATALOG_OBJECT_KIND_LABEL = 1;
  CATALOG_OBJECT_KIND_EDGE_TYPE = 2;
  CATALOG_OBJECT_KIND_CONSTRAINT = 3;
  CATALOG_OBJECT_KIND_INDEX = 4;
  CATALOG_OBJECT_KIND_TRIGGER = 5;
}

// A catalog object by kind and name.
message CatalogName {
  CatalogObjectKind object = 1;
  // The name.
  string name = 2;
}

// A catalog object that exists with another definition.
message CatalogObjectDiffers {
  CatalogObjectKind object = 1;
  // The name.
  string name = 2;
  // The revision it is at.
  uint64 revision = 3;
}

// A catalog change that named a revision the object is not at.
message CatalogRevisionMismatch {
  CatalogObjectKind object = 1;
  // The name.
  string name = 2;
  // The revision the change expected.
  uint64 expected = 3;
  // The revision the object is at; absent when it does not exist.
  optional uint64 current = 4;
}

// An interactive transaction.
message TransactionRef {
  // Its ID, 16 bytes.
  bytes transaction_id = 1;
}

// A transaction that ended with nothing of it applied.
message TransactionAborted {
  // Its ID, 16 bytes.
  bytes transaction_id = 1;
  // Why it ended.
  TransactionEndReason end = 2;
}

// Why a transaction ended.
enum TransactionEndReason {
  TRANSACTION_END_REASON_UNSPECIFIED = 0;
  // One of its statements failed.
  TRANSACTION_END_REASON_STATEMENT_FAILED = 1;
  // It stayed idle past the idle timeout and was rolled back.
  TRANSACTION_END_REASON_IDLE_EXPIRED = 2;
  // It stayed idle and its timeout outcome committed it.
  TRANSACTION_END_REASON_IDLE_COMMITTED = 3;
  // It stayed idle and the commit its timeout outcome made was refused.
  TRANSACTION_END_REASON_IDLE_COMMIT_REFUSED = 4;
  // It stayed idle and that commit's outcome is unknown.
  TRANSACTION_END_REASON_IDLE_COMMIT_UNKNOWN = 5;
  // It was rolled back.
  TRANSACTION_END_REASON_ROLLED_BACK = 6;
  // The stream a statement of it ran on was lost.
  TRANSACTION_END_REASON_STREAM_LOST = 7;
}

// A write OCC validation refused.
message TransactionConflict {
  // The interactive transaction's ID, 16 bytes; empty for a statement that
  // commits on its own.
  bytes transaction_id = 1;
  // What the validation found; possibly cut short at 8 KiB.
  string message = 2;
}

// A write a declared condition refused.
message InvariantRefused {
  // The interactive transaction's ID, 16 bytes; empty for a statement that
  // commits on its own.
  bytes transaction_id = 1;
  // Which condition refused it; possibly cut short at 8 KiB.
  string reason = 2;
}

// A conditioned write that found another version of its record.
message RevisionMismatch {
  // The interactive transaction's ID, 16 bytes; empty for a statement that
  // commits on its own.
  bytes transaction_id = 1;
  // The version the write was conditioned on; absent required absence.
  optional uint64 expected = 2;
  // The version the record has; absent means it is absent.
  optional uint64 current = 3;
}

// A transaction that buffered more than it may.
message TransactionTooLarge {
  // Its ID, 16 bytes.
  bytes transaction_id = 1;
  // Bytes it buffered.
  uint64 buffered = 2;
  // The limit in bytes.
  uint64 limit = 3;
}

// A storage endpoint at its hard capacity limit.
message CapacityExhausted {
  // The endpoint.
  string endpoint_id = 1;
  // Bytes it holds.
  uint64 used_bytes = 2;
  // Its hard limit in bytes.
  uint64 hard_limit_bytes = 3;
}

// A filesystem below its free-space reserve.
message StorageFull {
  // The endpoint path with the least free space.
  string path = 1;
  // Free bytes there.
  uint64 available_bytes = 2;
  // The reserve writes need.
  uint64 min_free_bytes = 3;
}

// A member that does not lead.
message NotLeader {
  // The member the group last named leader; absent while none is known.
  optional uint64 leader_id = 1;
}

// A member that runs another version than its group.
message MemberReadOnly {
  // The engine format version the member runs.
  uint32 own_engine = 1;
  // The host format epoch the member runs.
  uint64 own_host_epoch = 2;
  // The engine format version its group runs.
  uint32 group_engine = 3;
  // The host format epoch its group runs.
  uint64 group_host_epoch = 4;
  // The group moved past the member; otherwise the member is ahead.
  bool behind = 5;
  // The group's leader as far as the member knows; absent when unknown.
  optional uint64 leader_id = 6;
  // That leader's address; empty when the leader is unknown.
  string leader_address = 7;
  // The commit timestamp every read the member serves is as of.
  uint64 as_of = 8;
}

// A read below the MVCC retention horizon.
message OutsideRetention {
  // The timestamp the read asked for.
  uint64 requested = 1;
  // The oldest timestamp still readable.
  uint64 oldest_readable = 2;
}

// A snapshot read whose commits have not landed yet.
message ReadNotReady {
  // The timestamp the read asked for.
  uint64 requested = 1;
  // The latest timestamp answerable now; absent when there is none.
  optional uint64 ready_through = 2;
}

// A client operation that stands already.
message OperationSettled {
  // Its issuer, 16 bytes.
  bytes issuer = 1;
  // The issuer's incarnation it belongs to.
  uint64 incarnation = 2;
  // Its number within the incarnation.
  uint64 sequence = 3;
  // How it stands.
  RoutedOutcome outcome = 4;
  // Its committed outcome carries another intent than this attempt.
  bool intent_differs = 5;
}

// An operation of another deployment.
message ForeignOperation {
  // The deployment its descriptor names, 16 bytes.
  bytes deployment = 1;
}
