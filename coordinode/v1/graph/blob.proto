syntax = "proto3";

package coordinode.v1.graph;

import "google/api/annotations.proto";
import "coordinode/v1/operation/operation.proto";

// BlobStore service: large objects stored, read and deleted by id.
//
// An object is split into chunks of up to 256KB, each identified by the
// SHA-256 digest of its bytes. Every upload is its own blob with its own id,
// even when another blob holds the same bytes; identical chunks are stored
// once underneath and shared. Deleting a blob ends its hold on its chunks;
// the storage of chunks no blob, retained history or reader still needs is
// reclaimed in the background.
//
// A member of a group with other members refuses uploads and deletes with
// FAILED_PRECONDITION, reason BLOB_NOT_REPLICATED: blob bytes are held only on
// the member that writes them.
service BlobService {
  // Upload an object as a stream of chunks and store it as a new blob.
  rpc UploadBlob(stream BlobChunk) returns (UploadBlobResponse) {
    option (google.api.http) = {
      post: "/v1/blobs"
      body: "*"
    };
  }

  // Download a blob, returned as a stream of chunks in object order. The
  // whole blob is read as it stood when the download began, however slowly
  // the stream is consumed.
  rpc DownloadBlob(DownloadBlobRequest) returns (stream BlobChunk) {
    option (google.api.http) = {
      get: "/v1/blobs/{blob_id}"
    };
  }

  // Delete a blob. Chunks other blobs share stay readable through them.
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse) {
    option (google.api.http) = {
      delete: "/v1/blobs/{blob_id}"
    };
  }

  // Get blob metadata (chunk count, total size) without downloading.
  rpc GetBlobMeta(GetBlobMetaRequest) returns (BlobMeta) {
    option (google.api.http) = {
      get: "/v1/blobs/{blob_id}/meta"
    };
  }
}

// A single blob chunk in a streaming upload/download.
message BlobChunk {
  // Chunk data (up to 256KB per message). On upload the messages' data,
  // concatenated in order, is the object; their sizes need not match the
  // stored chunk size.
  bytes data = 1;

  // Chunk sequence number (0-based, for ordering verification).
  uint32 sequence = 2;

  // Upload only, on the first message: the client operation the upload
  // carries out. The upload then takes effect at most once however the call
  // is retried, and every attempt names the same blob, so a retry after a
  // lost answer never leaves a second blob behind. A retry of an operation
  // that already took effect stores nothing and is refused with
  // FAILED_PRECONDITION, reason OPERATION_SETTLED; ErrorInfo metadata
  // `blob_id` names the blob the operation stored. Absent stores the upload
  // unbound. Set on a later message, it is refused with INVALID_ARGUMENT.
  coordinode.v1.operation.OperationRef operation = 3;
}

// Response after a complete blob upload.
message UploadBlobResponse {
  // The blob's id: 32 lowercase hex digits naming this upload. Two uploads
  // of the same bytes get different ids.
  string blob_id = 1;

  // The SHA-256 digest of each chunk in object order (hex, 64 chars each),
  // repeated where the object repeats a chunk.
  repeated string chunk_ids = 2;

  // Total size of the uploaded blob in bytes.
  uint64 total_size = 3;

  // Number of distinct chunks whose bytes the store already held and now
  // shares instead of storing again.
  uint32 dedup_chunks = 4;
}

// Request to download a blob.
message DownloadBlobRequest {
  // Blob identifier returned from UploadBlob.
  string blob_id = 1;
}

// Request to delete a blob.
message DeleteBlobRequest {
  // Blob identifier returned from UploadBlob.
  string blob_id = 1;
}

// Response after blob deletion.
message DeleteBlobResponse {
  // Chunks whose storage this call reclaimed. Reclamation happens in the
  // background once nothing needs a chunk any more, so a delete reports 0;
  // its effect is that the blob no longer holds its chunks.
  uint32 chunks_deleted = 1;
}

// Request for blob metadata.
message GetBlobMetaRequest {
  // Blob identifier returned from UploadBlob.
  string blob_id = 1;
}

// Blob metadata.
message BlobMeta {
  // Blob identifier.
  string blob_id = 1;

  // Total size in bytes.
  uint64 total_size = 2;

  // Number of chunks, counting repeats.
  uint32 chunk_count = 3;

  // The SHA-256 digest of each chunk in object order (hex, 64 chars each).
  repeated string chunk_ids = 4;
}
