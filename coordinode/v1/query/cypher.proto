syntax = "proto3";

package coordinode.v1.query;

import "coordinode/v1/common/types.proto";
import "coordinode/v1/replication/consistency.proto";
import "google/api/annotations.proto";

// OpenCypher-compatible query execution service.
service CypherService {
  // Execute an OpenCypher query and return results.
  rpc ExecuteCypher(ExecuteCypherRequest) returns (ExecuteCypherResponse) {
    option (google.api.http) = {
      post: "/v1/query/cypher"
      body: "*"
    };
  }

  // Explain an OpenCypher query plan without executing.
  rpc ExplainCypher(ExplainCypherRequest) returns (ExplainCypherResponse) {
    option (google.api.http) = {
      post: "/v1/query/cypher/explain"
      body: "*"
    };
  }

  // Begin an interactive multi-statement transaction. Returns a
  // transaction_id; pass it on ExecuteCypherRequest for each statement, then
  // CommitTransaction or RollbackTransaction. All statements read the same
  // pinned snapshot (repeatable read) and writes commit atomically at commit.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/query/transaction/begin"
      body: "*"
    };
  }

  // Commit an interactive transaction: validate the read-set, then persist
  // every buffered statement's writes in a single proposal.
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/query/transaction/commit"
      body: "*"
    };
  }

  // Roll back an interactive transaction: discard all buffered writes.
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/query/transaction/rollback"
      body: "*"
    };
  }
}

message ExecuteCypherRequest {
  // OpenCypher query string.
  string query = 1;

  // Named query parameters bound at execution time.
  map<string, coordinode.v1.common.PropertyValue> parameters = 2;

  // Which cluster node may serve this read.
  // UNSPECIFIED takes the server's configured default, PRIMARY (leader-only
  // reads) unless the operator set another.
  // Use SECONDARY_PREFERRED for read scale-out in 3-node CE cluster.
  // A value the server does not know is rejected with INVALID_ARGUMENT.
  coordinode.v1.replication.ReadPreference read_preference = 3;

  // Data consistency guarantee for this read.
  // An omitted message or an UNSPECIFIED level takes the server's configured
  // default, LOCAL (whatever this node has applied) unless the operator set
  // another.
  // Use MAJORITY for reads that must not see rolled-back data.
  // Use LINEARIZABLE for strictest freshness (leader only, adds ~1 RTT).
  // A level the server does not know is rejected with INVALID_ARGUMENT.
  coordinode.v1.replication.ReadConcern read_concern = 4;

  // Durability guarantee for write statements (CREATE / MERGE / SET / DELETE).
  //
  // Omitted takes the server's configured default; that is MAJORITY with the
  // write journaled on each counted member unless the operator set another.
  // Present with `w` unset means MAJORITY. Ask for a weaker concern
  // explicitly, per request (`acks: 1`, `acks: 0`, `journal: MEMORY`), for
  // writes that may be lost with their leader.
  //
  // Causal sessions (read_concern.after_index > 0) require write_concern
  // MAJORITY. The server rejects writes with lower durability in causal
  // sessions because a non-majority write may never be replicated: if the leader
  // crashes before drain, the returned applied_index becomes a dangling causal
  // dependency that can never be satisfied by a follower read.
  //
  // Read-only queries ignore this field.
  coordinode.v1.replication.WriteConcern write_concern = 5;

  // Interactive transaction handle (from BeginTransaction). When non-zero,
  // this statement runs inside that transaction: it reads the transaction's
  // pinned snapshot and its writes buffer until CommitTransaction. When zero
  // (omitted), the statement auto-commits on its own (the default).
  uint64 transaction_id = 6;

  // Vector consistency of this statement, below a `vector_consistency` hint
  // in its query. UNSPECIFIED leaves it to the server: the mode the query's
  // read consistency implies. A node passing a session's statement to the
  // leader carries the session's setting here.
  coordinode.v1.replication.VectorConsistency vector_consistency = 7;

  // How long this statement waits for a vector index still being built, in
  // milliseconds, below a `vector_build_wait` hint in its query. Absent
  // takes the server's `vector_build_wait_ms`; 0 refuses a building index at
  // once.
  optional uint32 vector_build_wait_ms = 8;

  // Memory limit of this statement, in MiB: what its operators, access paths
  // and buffered results may hold at once. Absent takes the server's
  // `query_memory_limit_mb`. Zero or a value past the administrative ceiling
  // (4096 MiB) is rejected with INVALID_ARGUMENT. A statement that needs more
  // fails with RESOURCE_EXHAUSTED, reason EXCEEDS_MEMORY_BUDGET, and returns
  // no partial result. A node passing a session's statement to the leader
  // carries the session's setting here. The statement's deadline is the
  // call's gRPC deadline.
  optional uint32 query_memory_limit_mb = 9;
}

message ExecuteCypherResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
  QueryStats stats = 3;
}

message Row {
  repeated coordinode.v1.common.PropertyValue values = 1;
}

message QueryStats {
  int64 nodes_created = 1;
  int64 nodes_deleted = 2;
  int64 edges_created = 3;
  int64 edges_deleted = 4;
  int64 properties_set = 5;
  int64 execution_time_ms = 6;

  // Raft log index applied on the serving node at query time.
  // Clients use this as `after_index` in subsequent causal reads.
  // 0 means the node is not part of a Raft cluster (embedded mode).
  uint64 applied_index = 7;

  // True when the read was served by the Raft leader.
  // False for follower reads (read_preference = SECONDARY or NEAREST).
  bool served_by_leader = 8;

  // The HLC timestamp this statement's writes landed at, for a statement that
  // committed on its own. Zero for a read, and for a statement inside an
  // interactive transaction, whose timestamp belongs to the commit that ends
  // it (CommitTransactionResponse.commit_ts).
  //
  // This is the version of what the statement wrote: the same number
  // Node.version reports and CommitTransactionRequest.expect is stated
  // against. A client that writes and then means to write again
  // conditionally already holds what to state, with no read in between.
  uint64 commit_ts = 9;

  // Set by a member that does not run the version its group runs and so is
  // read-only: the commit timestamp of the last entry it applied, which this
  // read reflects and nothing after. Zero for a read served by a member that
  // runs its group's version. A read that must be current is refused by such
  // a member instead (FAILED_PRECONDITION, reason MEMBER_READ_ONLY).
  uint64 read_as_of_ts = 10;
}

message ExplainCypherRequest {
  string query = 1;
  map<string, coordinode.v1.common.PropertyValue> parameters = 2;
}

message ExplainCypherResponse {
  QueryPlan plan = 1;
}

message QueryPlan {
  string operator = 1;
  map<string, string> details = 2;
  repeated QueryPlan children = 3;
  double estimated_rows = 4;
}

message BeginTransactionRequest {}

message BeginTransactionResponse {
  // Handle for subsequent ExecuteCypher / CommitTransaction /
  // RollbackTransaction calls. Always non-zero.
  uint64 transaction_id = 1;
}

message CommitTransactionRequest {
  uint64 transaction_id = 1;

  // Commit only while these nodes are still at these versions. An empty list
  // is the ordinary unconditional commit.
  //
  // The condition is checked when the transaction commits, against the state
  // at that moment, so it protects the window between the read the caller
  // built on and the write it is making. A mismatch refuses the whole
  // transaction with ABORTED and reason REVISION_MISMATCH, carrying
  // `expected_version` and `current_version` in the error metadata: the
  // caller decides what to do next from those rather than reading the node
  // again and racing a second time.
  repeated ExpectedNodeVersion expect = 2;
}

// A node and the version the caller believes it is at.
message ExpectedNodeVersion {
  uint64 node_id = 1;

  // The version read earlier (Node.version). Unset requires the node NOT to
  // exist, which is the create-if-absent form of the same condition; it is
  // `optional` rather than a zero sentinel because zero is not a version a
  // node can have, and a field that means "absent" must be able to say so.
  optional uint64 version = 2;
}

message CommitTransactionResponse {
  // Raft log index the commit was applied at on the serving node — the causal
  // token clients pass as `after_index` on later reads. 0 in embedded mode.
  uint64 applied_index = 1;

  // HLC commit timestamp (microseconds since the Unix epoch) every mutation of
  // the transaction was applied at. Server-assigned. Commit timestamps are the
  // storage sequence numbers, so this value is the exact snapshot anchor for
  // the write: `AS OF TIMESTAMP <commit_ts>` (or `ReadConcern.at_timestamp`)
  // sees this transaction and nothing committed later, and a change-stream
  // consumer that has processed it resumes from `commit_ts + 1`. Present in
  // every mode; a read-only transaction reports its pinned read timestamp.
  uint64 commit_ts = 2;
}

message RollbackTransactionRequest {
  uint64 transaction_id = 1;
}

message RollbackTransactionResponse {}
