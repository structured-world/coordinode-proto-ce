syntax = "proto3";

package coordinode.v1.query;

import "coordinode/v1/common/types.proto";
import "coordinode/v1/replication/consistency.proto";
import "google/api/annotations.proto";

// OpenCypher-compatible query execution service.
service CypherService {
  // Execute an OpenCypher query and return results.
  rpc ExecuteCypher(ExecuteCypherRequest) returns (ExecuteCypherResponse) {
    option (google.api.http) = {
      post: "/v1/query/cypher"
      body: "*"
    };
  }

  // Explain an OpenCypher query plan without executing.
  rpc ExplainCypher(ExplainCypherRequest) returns (ExplainCypherResponse) {
    option (google.api.http) = {
      post: "/v1/query/cypher/explain"
      body: "*"
    };
  }

  // Begin an interactive multi-statement transaction. Returns a
  // transaction_id; pass it on ExecuteCypherRequest for each statement, then
  // CommitTransaction or RollbackTransaction. All statements read the same
  // pinned snapshot (repeatable read) and writes commit atomically at commit.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/query/transaction/begin"
      body: "*"
    };
  }

  // Commit an interactive transaction: validate the read-set, then persist
  // every buffered statement's writes in a single proposal.
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/query/transaction/commit"
      body: "*"
    };
  }

  // Roll back an interactive transaction: discard all buffered writes.
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse) {
    option (google.api.http) = {
      post: "/v1/query/transaction/rollback"
      body: "*"
    };
  }
}

message ExecuteCypherRequest {
  // OpenCypher query string.
  string query = 1;

  // Named query parameters bound at execution time.
  map<string, coordinode.v1.common.PropertyValue> parameters = 2;

  // Which cluster node may serve this read.
  // UNSPECIFIED defaults to PRIMARY (leader-only reads).
  // Use SECONDARY_PREFERRED for read scale-out in 3-node CE cluster.
  coordinode.v1.replication.ReadPreference read_preference = 3;

  // Data consistency guarantee for this read.
  // UNSPECIFIED defaults to LOCAL (return whatever this node has applied).
  // Use MAJORITY for reads that must not see rolled-back data.
  // Use LINEARIZABLE for strictest freshness (leader only, adds ~1 RTT).
  coordinode.v1.replication.ReadConcern read_concern = 4;

  // Durability guarantee for write statements (CREATE / MERGE / SET / DELETE).
  //
  // UNSPECIFIED / omitted defaults to W1 (leader-acknowledged, not replicated).
  // Use MAJORITY for production writes that must survive a single node failure.
  //
  // Causal sessions (read_concern.after_index > 0) require write_concern.level
  // >= MAJORITY. The server rejects writes with lower durability in causal
  // sessions because a non-majority write may never be replicated: if the leader
  // crashes before drain, the returned applied_index becomes a dangling causal
  // dependency that can never be satisfied by a follower read.
  //
  // Read-only queries ignore this field.
  coordinode.v1.replication.WriteConcern write_concern = 5;

  // Interactive transaction handle (from BeginTransaction). When non-zero,
  // this statement runs inside that transaction: it reads the transaction's
  // pinned snapshot and its writes buffer until CommitTransaction. When zero
  // (omitted), the statement auto-commits on its own (the default).
  uint64 transaction_id = 6;
}

message ExecuteCypherResponse {
  repeated string columns = 1;
  repeated Row rows = 2;
  QueryStats stats = 3;
}

message Row {
  repeated coordinode.v1.common.PropertyValue values = 1;
}

message QueryStats {
  int64 nodes_created = 1;
  int64 nodes_deleted = 2;
  int64 edges_created = 3;
  int64 edges_deleted = 4;
  int64 properties_set = 5;
  int64 execution_time_ms = 6;

  // Raft log index applied on the serving node at query time.
  // Clients use this as `after_index` in subsequent causal reads (R142).
  // 0 means the node is not part of a Raft cluster (embedded mode).
  uint64 applied_index = 7;

  // True when the read was served by the Raft leader.
  // False for follower reads (read_preference = SECONDARY or NEAREST).
  bool served_by_leader = 8;
}

message ExplainCypherRequest {
  string query = 1;
  map<string, coordinode.v1.common.PropertyValue> parameters = 2;
}

message ExplainCypherResponse {
  QueryPlan plan = 1;
}

message QueryPlan {
  string operator = 1;
  map<string, string> details = 2;
  repeated QueryPlan children = 3;
  double estimated_rows = 4;
}

message BeginTransactionRequest {}

message BeginTransactionResponse {
  // Handle for subsequent ExecuteCypher / CommitTransaction /
  // RollbackTransaction calls. Always non-zero.
  uint64 transaction_id = 1;
}

message CommitTransactionRequest {
  uint64 transaction_id = 1;
}

message CommitTransactionResponse {
  // Raft log index the commit was applied at on the serving node — the causal
  // token clients pass as `after_index` on later reads. 0 in embedded mode.
  uint64 applied_index = 1;
}

message RollbackTransactionRequest {
  uint64 transaction_id = 1;
}

message RollbackTransactionResponse {}
