syntax = "proto3";

package coordinode.v1.query;

import "coordinode/v1/common/types.proto";
import "coordinode/v1/graph/graph.proto";
import "google/api/annotations.proto";

// Vector search operations.
service VectorService {
  // Search for nearest neighbors by vector similarity.
  rpc VectorSearch(VectorSearchRequest) returns (VectorSearchResponse) {
    option (google.api.http) = {
      post: "/v1/query/vector/search"
      body: "*"
    };
  }

  // Hybrid search combining graph traversal and vector similarity.
  rpc HybridSearch(HybridSearchRequest) returns (HybridSearchResponse) {
    option (google.api.http) = {
      post: "/v1/query/vector/hybrid"
      body: "*"
    };
  }
}

message VectorSearchRequest {
  // Label to search within.
  string label = 1;
  // Property name containing vectors.
  string property = 2;
  // Query vector.
  coordinode.v1.common.Vector query_vector = 3;
  // Number of nearest neighbors to return.
  uint32 top_k = 4;
  // Distance metric (cosine, l2, dot, l1).
  DistanceMetric metric = 5;
}

enum DistanceMetric {
  DISTANCE_METRIC_UNSPECIFIED = 0;
  DISTANCE_METRIC_COSINE = 1;
  DISTANCE_METRIC_L2 = 2;
  DISTANCE_METRIC_DOT = 3;
  DISTANCE_METRIC_L1 = 4;
}

message VectorSearchResponse {
  repeated VectorResult results = 1;
  // Lifecycle + freshness of the HNSW index that served this query. Set
  // server-side from the index registry's health signal. Absent (field unset)
  // when the query did not run against a managed HNSW index (for example a
  // brute-force fallback on a tiny dataset). A client implements
  // read-your-writes by comparing `index_state.indexed_hlc` against the HLC
  // of its own prior write (the Pinecone LSN-header pattern).
  VectorIndexState index_state = 2;
}

message VectorResult {
  coordinode.v1.graph.Node node = 1;
  float distance = 2;
}

// Lifecycle state and freshness watermark of a vector index. Computed
// server-side; clients never send this. Surfaced so callers can distinguish a
// fully-built index from one being rebuilt after segment migration, and can
// gauge how far the local replica has caught up with committed writes.
message VectorIndexState {
  // Lifecycle state of the index at the time it served the query.
  enum State {
    // Unset / unknown — treat as a degenerate case, not a guarantee.
    STATE_UNSPECIFIED = 0;
    // Fully built and serving at the documented recall.
    STATE_READY = 1;
    // Being (re)built after segment migration or reconfiguration; results may
    // be partial-recall depending on the label's VECTOR_REBUILD_POLICY.
    STATE_REBUILDING = 2;
    // Unavailable; see `offline_reason`.
    STATE_OFFLINE = 3;
  }
  // Current lifecycle state.
  State state = 1;
  // Rebuild progress in [0.0, 1.0]. 0 unless `state == INDEX_STATE_REBUILDING`.
  float progress = 2;
  // Best-effort estimate of remaining rebuild time, in milliseconds. 0 unless
  // `state == INDEX_STATE_REBUILDING`.
  uint64 eta_ms = 3;
  // Freshness watermark: the HLC commit timestamp (wall-clock microseconds,
  // ADR-007) of the last write the local index-maintenance worker has applied.
  // This is the read-your-writes fence — a client that wrote at HLC W has been
  // served a fully-current index iff `indexed_hlc >= W`. 0 when nothing has
  // been applied yet or `state == INDEX_STATE_OFFLINE`.
  uint64 indexed_hlc = 4;
  // Human-readable reason when `state == INDEX_STATE_OFFLINE` (for example
  // "segment_lost", "disk_io", "manual_disable"); empty otherwise.
  string offline_reason = 5;
}

message HybridSearchRequest {
  // Starting node for graph traversal.
  uint64 start_node_id = 1;
  // Edge type to traverse.
  string edge_type = 2;
  // Max traversal depth.
  uint32 max_depth = 3;
  // Vector search parameters applied after traversal.
  string vector_property = 4;
  coordinode.v1.common.Vector query_vector = 5;
  uint32 top_k = 6;
  DistanceMetric metric = 7;
}

message HybridSearchResponse {
  repeated VectorResult results = 1;
  // Lifecycle + freshness of the HNSW index that served the vector phase of
  // this hybrid query. Same semantics as `VectorSearchResponse.index_state`;
  // unset when the vector phase did not run against a managed HNSW index.
  VectorIndexState index_state = 2;
}
