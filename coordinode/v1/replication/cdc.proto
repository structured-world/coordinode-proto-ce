syntax = "proto3";

package coordinode.v1.replication;

// CE Change Data Capture: tail a shard's Raft log via gRPC server-side
// streaming.
//
// Client reconnects with a ResumeToken to continue from a position it chose.
// At-least-once delivery. History is released only up to a position the
// client acknowledges with AcknowledgeSubscription.
service ChangeStreamService {
  // Open a long-lived server-side streaming RPC that tails the Raft log.
  //
  // The server streams a ChangeEvent for each log entry once the serving node
  // has applied it; entries that are not committed yet are never sent. When
  // caught up, the stream waits until the node applies another entry. The
  // stream stays open until the client cancels or the connection drops.
  //
  // On reconnect, pass the last received ResumeToken to resume without gaps.
  // Omit resume_token (or set all fields to zero) to start from the oldest
  // retained entry.
  //
  // Every stream reads as a registered consumer: the request names the
  // consumer and either registers it with an explicit retention policy
  // (`incarnation` 0) or resumes a live registration (`incarnation` from the
  // first stream). The registration outlives the connection: a STRICT one
  // until CancelSubscription, a BOUNDED one until a declared bound is
  // crossed. The response's initial metadata carries the registration's
  // incarnation as `x-coordinode-consumer-incarnation`.
  //
  // A token whose position the log no longer holds is refused with
  // FAILED_PRECONDITION and ErrorInfo reason RETENTION_LOST (metadata
  // `requested_index`, `first_retained_index`): the stream never resumes past
  // a gap. A registration that has ended is refused with FAILED_PRECONDITION
  // and reason CONSUMER_TERMINATED (metadata `incarnation`, `reason`,
  // `checkpoint`); registering the id again starts a new incarnation.
  //
  // Sending an event is not delivery: the registration keeps every entry
  // from its acknowledged position on, so a stream resumed without a token
  // starts there and re-sends what the client never acknowledged. A resume
  // token chooses where reading starts and releases nothing.
  rpc Subscribe(SubscribeRequest) returns (stream ChangeEvent);

  // State that the client holds, durably, every event of its subscription
  // before `position`: the registration may stop protecting that history,
  // and a stream resumed without a token starts at `position`. Only this
  // call releases history; acknowledging an earlier position than a
  // previous one changes nothing. Refused with INVALID_ARGUMENT for a
  // position past what the serving node has applied (nothing that far was
  // sent) or for another shard, and like CancelSubscription for an ended or
  // unknown incarnation.
  rpc AcknowledgeSubscription(AcknowledgeSubscriptionRequest) returns (AcknowledgeSubscriptionResponse);

  // End a consumer's registration: it stops holding the log, and its
  // incarnation is refused from then on. Refused with FAILED_PRECONDITION and
  // reason CONSUMER_TERMINATED when the incarnation has already ended, and
  // NOT_FOUND for an id never registered.
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
}

// How long a consumer's registration protects the history it still needs.
// One of the two must be chosen; there is no default.
message ConsumerRetention {
  oneof policy {
    // Protection lasts until the consumer is cancelled. Missing heartbeats
    // do not end it.
    StrictRetention strict = 1;
    // Protection ends once one of the declared bounds is crossed.
    BoundedRetention bounded = 2;
  }
}

// Protection until cancellation.
message StrictRetention {}

// Finite bounds after which the registration ends. Both limits are required
// and must be above zero.
message BoundedRetention {
  // Most age, in milliseconds, of the oldest log entry the consumer has not
  // yet been sent.
  uint64 max_progress_lag_ms = 1;

  // Most bytes of log the consumer's position may require the shard to keep.
  uint64 max_retained_bytes = 2;

  // Longest time, in milliseconds, without the consumer being connected and
  // heartbeating. Absent: the registration does not end for being absent,
  // only for the two limits above.
  optional uint64 liveness_timeout_ms = 3;
}

message CancelSubscriptionRequest {
  // The consumer to cancel.
  string consumer_id = 1;

  // The incarnation to cancel, from the Subscribe response metadata. A
  // different incarnation of the same id is left alone.
  uint64 incarnation = 2;
}

message CancelSubscriptionResponse {}

message AcknowledgeSubscriptionRequest {
  // The consumer acknowledging.
  string consumer_id = 1;

  // Its incarnation, from the Subscribe response metadata.
  uint64 incarnation = 2;

  // The `position` of the last event the client no longer needs the source
  // for: it holds the events durably, or it has durably taken their effect
  // into the state it keeps (for example by reading the current state at a
  // snapshot that covers this position). Everything up to it is
  // acknowledged: the server may release that source for this consumer, a
  // resume continues after it, and a BOUNDED consumer's progress lag is
  // measured from it.
  ResumeToken position = 3;
}

message AcknowledgeSubscriptionResponse {}

// Position in a shard's Raft log used to resume after disconnect.
//
// The token names one log index, `segment_id + entry_offset`: the next entry
// to deliver. It stays valid when the server rewrites its log files.
message ResumeToken {
  // Shard this stream targets. Always 0 in CE single-shard mode.
  uint32 shard_id = 1;

  // Log index of the first entry of the segment that held the last delivered
  // entry. 0 together with `entry_offset` 0 means "the oldest retained entry".
  uint64 segment_id = 2;

  // Entries of that segment already delivered, counted from `segment_id`.
  uint64 entry_offset = 3;
}

// Filters applied server-side before streaming events to the client.
message CdcFilters {
  // If non-empty, only deliver events that touch at least one adjacency or
  // edge-property key whose edge type matches one of these strings.
  // Example: ["FOLLOWS", "LIKES"]
  // Leave empty to receive all edge types.
  repeated string edge_types = 1;

  // When set: only deliver events whose `is_migration` flag equals this value.
  // When absent (HasField returns false): deliver both migration and non-migration events.
  optional bool is_migration = 2;
}

message SubscribeRequest {
  // Token from the last received ChangeEvent.position.
  // Omit (all-zero) to start from the oldest retained entry.
  ResumeToken resume_token = 1;

  // Optional filter to reduce bandwidth.
  CdcFilters filters = 2;

  // The consumer this stream reads as: globally unique, chosen by the client.
  // Required.
  string consumer_id = 3;

  // 0 registers the consumer anew with `retention`, starting at
  // `resume_token` (or the oldest retained entry without one); refused with
  // ALREADY_EXISTS while another incarnation of the id is live. Any other
  // value resumes that live incarnation, and `retention` is ignored.
  uint64 incarnation = 4;

  // Required when registering (`incarnation` 0).
  ConsumerRetention retention = 5;
}

// A single applied Raft log entry delivered to the CDC consumer.
message ChangeEvent {
  // HLC commit timestamp of the entry, in wall-clock microseconds since the
  // Unix epoch with logical increments inside one microsecond: the latest
  // commit timestamp of the transactions it carries. 0 for an entry that
  // carries none (membership, leader blank).
  uint64 ts = 1;

  // Term of the leader that wrote this entry.
  uint64 term = 2;

  // Raft log index. Monotonically increasing per shard.
  uint64 log_index = 3;

  // Shard that produced this entry.
  uint32 shard_id = 4;

  // True if this entry was written during a shard migration (e.g. bulk data
  // transfer). Most CDC consumers should skip migration entries.
  bool is_migration = 5;

  // The mutations carried by this log entry. Empty for an entry that carries
  // none, and for a progress event: entries up to `position` held nothing
  // the stream's filters keep, so the client can acknowledge past them.
  repeated ChangeOp ops = 6;

  // Where the stream continues after this event: pass it on reconnect to
  // resume here, and to AcknowledgeSubscription once the event is held.
  ResumeToken position = 7;
}

// A single storage mutation within a ChangeEvent.
message ChangeOp {
  ChangeOpType type = 1;

  // Storage partition (see coordinode_storage::engine::partition::Partition).
  uint32 partition = 2;

  // Storage key. Format depends on partition type. For REMOVE_RANGE this carries
  // the range's inclusive start bound.
  bytes key = 3;

  // Value bytes. Empty for DELETE ops; carries the merge operand for MERGE. For
  // REMOVE_RANGE this carries the range's exclusive end bound (the half-open
  // range deleted is [key, value)).
  bytes value = 4;
}

enum ChangeOpType {
  CHANGE_OP_TYPE_UNSPECIFIED = 0;
  INSERT = 1;
  DELETE = 2;
  MERGE = 3;
  NOOP = 4;
  RAFT_ENTRY = 5;
  RAFT_TRUNCATION = 6;
  // Delete every key in the half-open range [key, value) of `partition` with a
  // single range tombstone. Emitted for a dense contiguous run of deleted keys
  // (run-length coalescing) or a whole-prefix DROP; the range covers only keys
  // that are all being deleted, never a surviving key in a gap.
  REMOVE_RANGE = 7;
}
