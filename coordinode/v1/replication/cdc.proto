syntax = "proto3";

package coordinode.v1.replication;

// CE Change Data Capture: the committed changes of a shard as logical
// events, streamed from its Raft log via gRPC server-side streaming.
//
// Each committed transaction is a unit; each of its effects is an event: a
// put, patch or removal of a node, a relationship's presence, its
// properties, or one version or discriminated instance of it. The client
// keeps an opaque cursor and reconnects with it to continue where it chose.
// At-least-once delivery. History is released only up to a cursor the
// client acknowledges with AcknowledgeSubscription.
service ChangeStreamService {
  // Open a long-lived server-side streaming RPC that tails the Raft log.
  //
  // The server streams ChangeBatch messages, each with whole units, once the
  // serving node has applied their log entries; entries that are not
  // committed yet are never sent. Every unit the stream passes is in a
  // batch, one with no event the interest takes too. When caught up, the
  // stream waits until the node applies another entry. The stream stays
  // open until the client cancels or the connection drops.
  //
  // On reconnect, pass the cursor of the last batch received to resume
  // without gaps. Omit it to start where the registration stands: its
  // acknowledged position, or the oldest retained entry for a new one. A
  // cursor binds the history, the event interpretation and the interest it
  // was read with: one of another history or interpretation, or read with
  // another interest than the request's, is refused with INVALID_ARGUMENT.
  //
  // Every stream reads as a registered consumer: the request names the
  // consumer and either registers it with an explicit retention policy
  // (`incarnation` 0) or resumes a live registration (`incarnation` from the
  // first stream). The registration outlives the connection until
  // CancelSubscription. The response's initial metadata carries the
  // registration's incarnation as `x-coordinode-consumer-incarnation`.
  //
  // A position the log no longer holds is refused with FAILED_PRECONDITION
  // and ErrorInfo reason RETENTION_LOST (metadata `requested_index`,
  // `first_retained_index`): the stream never resumes past a gap, and never
  // jumps to the newest entry in its place. An ORDINARY consumer that gets it
  // rebuilds its state and acknowledges a position the log holds. A
  // registration that has ended is refused with FAILED_PRECONDITION and
  // reason CONSUMER_TERMINATED (metadata `incarnation`, `reason`,
  // `checkpoint`); registering the id again starts a new incarnation.
  //
  // A unit the stream cannot project (a change recorded without the context
  // that says what it means) fails the stream with FAILED_PRECONDITION and
  // ErrorInfo reason CHANGE_FEED_UNSUPPORTED; the stream does not pass it.
  //
  // Sending a batch is not delivery: a stream resumed without a cursor
  // starts at the acknowledged position and re-sends what the client never
  // acknowledged, while the log still holds it. A cursor chooses where
  // reading starts and releases nothing.
  rpc Subscribe(SubscribeRequest) returns (stream ChangeBatch);

  // State that the client holds, durably, every unit of its subscription
  // before `cursor`: the registration may stop protecting that history, and
  // a stream resumed without a cursor starts there. Only this call releases
  // history; acknowledging an earlier cursor than a previous one changes
  // nothing. Refused with INVALID_ARGUMENT for a cursor past what the
  // serving node has applied (nothing that far was sent) or of another
  // history, and like CancelSubscription for an ended or unknown
  // incarnation.
  rpc AcknowledgeSubscription(AcknowledgeSubscriptionRequest) returns (AcknowledgeSubscriptionResponse);

  // End a consumer's registration: it stops holding the log, and its
  // incarnation is refused from then on. Refused with FAILED_PRECONDITION and
  // reason CONSUMER_TERMINATED when the incarnation has already ended, and
  // NOT_FOUND for an id never registered.
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
}

// Whether a consumer's registration protects the history it still needs.
// One of the two must be chosen; there is no default.
message ConsumerRetention {
  reserved 2;
  reserved "bounded";

  oneof policy {
    // Protection lasts until the consumer is cancelled. Missing heartbeats
    // do not end it, and the log keeps every entry from the acknowledged
    // position on.
    StrictRetention strict = 1;
    // No protection: the registration records the acknowledged position
    // only, and the log's own retention decides how far back it reaches.
    OrdinaryRetention ordinary = 3;
  }
}

// Protection until cancellation.
message StrictRetention {}

// Progress only, holding no history.
message OrdinaryRetention {}

message CancelSubscriptionRequest {
  // The consumer to cancel.
  string consumer_id = 1;

  // The incarnation to cancel, from the Subscribe response metadata. A
  // different incarnation of the same id is left alone.
  uint64 incarnation = 2;
}

message CancelSubscriptionResponse {}

message AcknowledgeSubscriptionRequest {
  // The consumer acknowledging.
  string consumer_id = 1;

  // Its incarnation, from the Subscribe response metadata.
  uint64 incarnation = 2;

  // The `cursor` of the last batch the client no longer needs the source
  // for: it holds the units durably, or it has durably taken their effect
  // into the state it keeps. Everything before it is acknowledged: the
  // server may release that source for this consumer, and a resume without
  // a cursor continues from it.
  bytes cursor = 3;
}

message AcknowledgeSubscriptionResponse {}

// What a subscription follows. Absent `labels` follows the nodes of every
// label; present and empty follows none. The same for `edge_types`.
message ChangeInterest {
  // Labels whose nodes the subscription follows: a node event reaches it
  // when the node carries one of them before or after the event. A name is
  // bound to the label it names when the subscription opens. A label not
  // bound is refused with INVALID_ARGUMENT, one a type implies with
  // UNIMPLEMENTED.
  NameList labels = 1;

  // Relationship types whose relationships the subscription follows, by
  // name.
  NameList edge_types = 2;
}

// A list of names, present even when empty.
message NameList {
  // The names.
  repeated string names = 1;
}

message SubscribeRequest {
  // The cursor of the last batch received. Omit to start where the
  // registration stands.
  bytes cursor = 1;

  // What the subscription follows; with a cursor, the interest it was read
  // with.
  ChangeInterest interest = 2;

  // The consumer this stream reads as: globally unique, chosen by the client.
  // Required, non-empty and at most 65525 bytes of UTF-8; a longer id is
  // refused with INVALID_ARGUMENT.
  string consumer_id = 3;

  // 0 registers the consumer anew with `retention`, starting at `cursor` (or
  // the oldest retained entry without one); refused with ALREADY_EXISTS
  // while another incarnation of the id is live. Any other value resumes
  // that live incarnation, and `retention` is ignored.
  uint64 incarnation = 4;

  // Required when registering (`incarnation` 0).
  ConsumerRetention retention = 5;
}

// Units read from the log, and where the stream continues after them.
message ChangeBatch {
  // The units, in log order. Empty for a batch whose entries carried no
  // unit; the batch still moves `cursor`. The first may continue a unit an
  // earlier batch began, and the last may stop inside one, which the next
  // batch continues: a transaction with more events than one batch holds
  // arrives in fragments.
  repeated ChangeUnit units = 1;

  // Where the stream continues after this batch: pass it on reconnect to
  // resume here, and to AcknowledgeSubscription once the units are held.
  // Opaque; it binds the history, the event interpretation and the
  // interest.
  bytes cursor = 2;
}

// One committed transaction, or a fragment of one: the events of it in the
// ordinal range [first_ordinal, end_ordinal) the subscription takes.
message ChangeUnit {
  // HLC commit timestamp of the transaction, in wall-clock microseconds
  // since the Unix epoch with logical increments inside one microsecond.
  uint64 commit_ts = 1;

  // The Raft log index of the entry carrying it.
  uint64 log_index = 2;

  // Its place among the transactions of that entry.
  uint32 unit = 3;

  // How many events the transaction has in all, taken by the subscription
  // or not: with the ordinals of the events received, the client tells it
  // received every event of it its interest takes.
  uint32 projected = 4;

  // The events the subscription takes, in ordinal order.
  repeated LogicalChange events = 5;

  // The first ordinal this delivery covers: zero unless an earlier batch
  // delivered the transaction's start.
  uint32 first_ordinal = 6;

  // The ordinal after the last one this delivery covers, taken by the
  // subscription or not: equal to `projected` when the delivery reaches the
  // transaction's end. A transaction is complete once its deliveries cover
  // [0, projected).
  uint32 end_ordinal = 7;
}

// One effect of a committed transaction.
message LogicalChange {
  // Its place among the transaction's events, counted before any
  // subscription filters them: with `log_index` and `unit`, the event's
  // identity, the same for every subscription and every delivery of it.
  uint32 ordinal = 1;

  // What it does to its target.
  ChangeAction action = 2;

  // What it changes.
  oneof target {
    // A node's record, or one version of a temporal node.
    NodeTarget node = 3;
    // A relationship's presence.
    RelationshipTarget relationship = 4;
    // The properties of a relationship that is neither versioned nor
    // discriminated.
    RelationshipTarget properties = 5;
    // One version or discriminated instance of a relationship, its
    // properties included.
    RelationshipTarget instance = 6;
    // The labels a type implies, as one activation of a change to them
    // left them: every node of the type gains and loses labels without a
    // node event of its own. `labels_before` and `labels_after` name the
    // type and what it implied before and implies after.
    ScopeTarget scope = 11;
  }

  // The record or properties a PUT writes, or the delta a PATCH applies, in
  // the storage encoding; empty for a REMOVE and for a relationship's
  // presence.
  bytes payload = 7;

  // How a node event reaches the subscription's labels: APPLY for a
  // subscription following every label and for every relationship event.
  ChangeDelivery delivery = 8;

  // The labels a node carried before the transaction, its type's implied
  // ones included, by name; empty for a relationship event.
  repeated string labels_before = 9;

  // The labels a node carries after the event, its type's implied ones
  // included, by name; empty for a relationship event.
  repeated string labels_after = 10;
}

// A type whose implied labels one activation changed.
message ScopeTarget {
  // The type's name.
  string label = 1;

  // The activation that put the change in force: distinct for every change,
  // a change back to an earlier declaration included. A subscription keeping
  // state by label reconciles the type's nodes once per activation, or
  // rebuilds the scope.
  uint64 activation = 2;
}

// A node and, for a temporal node, the version.
message NodeTarget {
  // The node's id.
  uint64 node_id = 1;

  // The version's start, in milliseconds since the Unix epoch, for a version
  // of a temporal node.
  optional int64 valid_from = 2;
}

// A relationship, by type and endpoints, and its instance when it has one.
message RelationshipTarget {
  // The relationship type's name.
  string edge_type = 1;

  // The source node's id.
  uint64 source_id = 2;

  // The target node's id.
  uint64 target_id = 3;

  // The version or discriminator of an instance, in its key encoding; empty
  // for a relationship's presence or properties.
  bytes instance = 4;
}

// What an event does to its target.
enum ChangeAction {
  CHANGE_ACTION_UNSPECIFIED = 0;
  // The target is written whole: it is replaced, or comes to exist. A PUT
  // does not say which.
  CHANGE_ACTION_PUT = 1;
  // The target changes by the payload's delta.
  CHANGE_ACTION_PATCH = 2;
  // The target ceases to exist.
  CHANGE_ACTION_REMOVE = 3;
  // What a type implies changed: its nodes enter and leave label scopes
  // with no node event of their own.
  CHANGE_ACTION_SCOPE_CHANGE = 4;
}

// How a node event reaches a subscription following some labels.
enum ChangeDelivery {
  CHANGE_DELIVERY_UNSPECIFIED = 0;
  // The node is in the subscription's scope before and after: the event
  // applies.
  CHANGE_DELIVERY_APPLY = 1;
  // The node joins the scope with the record the event writes.
  CHANGE_DELIVERY_ENTER = 2;
  // The node leaves the scope: deleted, relabelled or retyped out of it.
  CHANGE_DELIVERY_LEAVE = 3;
}
