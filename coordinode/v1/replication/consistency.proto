syntax = "proto3";

package coordinode.v1.replication;

// Named write concern modes: rules for `w` that are not a fixed count of
// members.
enum WriteConcernMode {
  // Not a valid choice on the wire: a WriteConcern whose `w` is unset means
  // the default, MAJORITY. Set `mode` explicitly to one of the values below.
  WRITE_CONCERN_MODE_UNSPECIFIED = 0;
  // Acknowledged once a majority of the group's members (the leader included)
  // holds the write in the state named by `journal`. Survives the loss of a
  // minority. The default.
  WRITE_CONCERN_MODE_MAJORITY = 1;
}

// The state each acknowledging member must hold the write in before it
// counts towards `w`. Independent of `w`: `w` says how many members, `journal`
// says how durably each of them holds the write.
//
// A write concern decides when the caller is answered, never whether the
// write is replicated: every write enters the group's log through the leader
// and is applied on every member. CACHE and MEMORY answer before the write is
// in the log and keep it in a volatile overlay until the drain proposes it;
// a leader crash before the drain loses every write still in that overlay.
// Use them for telemetry, hot counters and session state only, never for
// source-of-truth data.
enum Journal {
  // Same as JOURNAL: the default when the field is omitted.
  JOURNAL_UNSPECIFIED = 0;
  // The write is fsynced to the member's journal (the Raft log) before it is
  // counted. Survives process crash and power failure.
  JOURNAL_JOURNAL = 1;
  // The write is in the member's RAM + NVMe overlay (~100µs) before it is
  // counted. Survives a process crash, not a power failure before the drain.
  JOURNAL_CACHE = 2;
  // The write is in the member's RAM-only overlay (~1µs) before it is
  // counted. Visible at once to local readers that accept volatile data;
  // lost on process crash before the drain.
  JOURNAL_MEMORY = 3;
}

// Write concern configuration for a write statement or a session default.
//
// Two independent axes, as in MongoDB: `w` (how many members acknowledge) and
// `journal` (what state each of them holds the write in). `w` is either a
// count of members or a named mode; the two never share a number space, so
// `acks: 3` is three members in a group of any size and can never be
// confused with a mode. Leaving `w` unset selects the default, MAJORITY;
// asking for fire-and-forget is always explicit (`acks: 0`). Neither axis is
// ever silently changed to satisfy the other: a combination the server cannot
// honour is rejected with INVALID_ARGUMENT.
message WriteConcern {
  // Field 1 carried the retired WriteConcernLevel enumeration; field 2 the
  // retired boolean journal flag, replaced by the three-valued `journal`.
  reserved 1, 2;
  reserved "level";

  oneof w {
    // Number of members, the leader included, that must hold the write in
    // the `journal` state before the caller is answered. 0 = fire-and-forget:
    // the write still goes through the leader and the log, the caller is
    // answered at once and is not told whether it committed. 1 = the leader
    // alone (rollback possible if the leader fails before replication). N = N
    // members. A value above the group's member count is rejected with
    // INVALID_ARGUMENT.
    uint32 acks = 4;
    // A named rule instead of a count. See WriteConcernMode.
    WriteConcernMode mode = 5;
  }
  // The state each counted member holds the write in. Omitted = JOURNAL.
  // CACHE and MEMORY are accepted only with `acks: 0` or `acks: 1`: a
  // volatile state cannot be confirmed across members, so combining them
  // with `acks` above 1 or with MAJORITY is rejected with INVALID_ARGUMENT.
  Journal journal = 6;
  // Time in milliseconds to wait for `w` to be satisfied; 0 = no timeout. On
  // timeout the call fails, but the write is NOT rolled back: it may still
  // commit afterwards.
  uint32 timeout_ms = 3;
}

// Read concern levels.
enum ReadConcernLevel {
  READ_CONCERN_LEVEL_UNSPECIFIED = 0;
  // Read from local replica (may be stale).
  READ_CONCERN_LEVEL_LOCAL = 1;
  // Read data committed by majority.
  READ_CONCERN_LEVEL_MAJORITY = 2;
  // Linearizable read (strongest guarantee).
  READ_CONCERN_LEVEL_LINEARIZABLE = 3;
  // Read from a consistent MVCC snapshot.
  READ_CONCERN_LEVEL_SNAPSHOT = 4;
}

// Read concern configuration.
message ReadConcern {
  // Consistency level for this read. UNSPECIFIED defaults to LOCAL.
  ReadConcernLevel level = 1;

  // Causal fence: wait until the serving node has applied log entries up to
  // at least this Raft log index before executing the read.
  //
  // Set to the `QueryStats.applied_index` value from a prior write response
  // to guarantee read-your-writes: the read is guaranteed to observe all
  // mutations up to and including that write.
  //
  // 0 = no fence (default). Only valid with level = MAJORITY or SNAPSHOT;
  // returns FAILED_PRECONDITION if level = LOCAL or LINEARIZABLE.
  //
  // Has no effect in standalone (non-Raft) mode — all writes are immediately
  // visible. The returned applied_index will always be 0 in standalone mode,
  // so clients should not set after_index unless operating in cluster mode.
  uint64 after_index = 2;

  // Snapshot pin: read the database as of this HLC timestamp (microseconds
  // since Unix epoch, leader-assigned).
  //
  // Only valid with level = SNAPSHOT. Setting this with any other level
  // returns FAILED_PRECONDITION. 0 = no pin (latest snapshot of the chosen
  // level applies).
  //
  // Typical use: time-travel reads ("what did this query return at 2026-05-15
  // 12:00:00?"). The timestamp must be within the MVCC retention window —
  // older snapshots are GC'd. Reads beyond retention return UNAVAILABLE.
  //
  // Distinct from `after_index`: `after_index` is a *fence* (wait until at
  // least this index is applied), `at_timestamp` is a *pin* (read exactly
  // this version, no waiting).
  uint64 at_timestamp = 3;
}

// Read preference for routing read operations.
enum ReadPreference {
  READ_PREFERENCE_UNSPECIFIED = 0;
  READ_PREFERENCE_PRIMARY = 1;
  READ_PREFERENCE_PRIMARY_PREFERRED = 2;
  READ_PREFERENCE_SECONDARY = 3;
  READ_PREFERENCE_SECONDARY_PREFERRED = 4;
  READ_PREFERENCE_NEAREST = 5;
}
