syntax = "proto3";

package coordinode.v1.replication;

// Raft consensus inter-node protocol (gRPC-only, no REST — internal).
//
// Uses opaque bytes for openraft type serialization (msgpack).
// This decouples the proto schema from openraft's internal generic types,
// making the protocol stable across openraft version upgrades.
service RaftService {
  // Leader election vote (unary).
  // Payload: msgpack(VoteRequest) → msgpack(VoteResponse)
  rpc Vote(RaftPayload) returns (RaftPayload);

  // Pre-vote (unary): whether the receiver would grant a vote at the next
  // term, asked before a candidate raises its term. Nothing is persisted and
  // the receiver's term does not change, so a member cut off from its leader
  // learns it cannot win instead of returning with an inflated term that
  // deposes a healthy leader.
  // Payload: msgpack(VoteRequest) → msgpack(VoteResponse)
  rpc PreVote(RaftPayload) returns (RaftPayload);

  // Log replication (unary, single batch).
  // Used as fallback when streaming is not available.
  // Payload: msgpack(AppendEntriesRequest) → msgpack(AppendEntriesResponse)
  rpc AppendEntries(RaftPayload) returns (RaftPayload);

  // Pipeline log replication (bidirectional streaming).
  // Leader streams AppendEntriesRequest, follower streams StreamAppendResult.
  // This is the primary replication path — higher throughput than unary.
  rpc StreamAppend(stream RaftPayload) returns (stream RaftPayload);

  // Snapshot transfer (client streaming).
  // Leader streams snapshot chunks, follower responds with ack.
  rpc Snapshot(stream RaftPayload) returns (RaftPayload);

  // Leadership transfer (unary).
  rpc TransferLeader(RaftPayload) returns (RaftEmpty);

  // The group's members as the answering member knows them, asked by a
  // member that is refusing a peer it does not know yet: a member that
  // missed a membership change, or one still joining. Only a member of the
  // group is answered, and the asker takes the answer only from a member it
  // already knows, so no one becomes a member by asking.
  // Payload: empty → msgpack(the deployment, the log index of the
  // membership and every member's node id, address, node identity and role)
  rpc Members(RaftPayload) returns (RaftPayload);
}

// Opaque payload containing msgpack-serialized openraft types.
message RaftPayload {
  // The msgpack-serialized consensus message named by the RPC (request on the
  // way in, response on the way out). Produced and read by the engine only.
  bytes data = 1;

  // The consensus group the message belongs to. A server hosts replicas of
  // several groups over one connection per peer, and dispatches a request to
  // its replica of this group; a request for a group the server does not
  // host is refused with NOT_FOUND. Set by the sender on every request,
  // including each message of a stream, which must all name the same group.
  // Must equal the group named by the call's version record. Responses echo
  // the request's group.
  uint64 group = 2;

  // The room the answering member holds for its leader's client entries,
  // set on every response to an append (unary or each message of a
  // stream), heartbeats included. Absent on requests and other responses,
  // and from a member without a hard limit, whose room is unbounded.
  optional ClientGrant grant = 3;
}

// Room a member holds, admitted against its own hard limit, for client
// entries its leader appends after the member's last log entry. The leader
// appends a client entry only while a quorum's grants cover it together with
// every client entry it sent past each member's reported index; the member
// then pays for it from this room and never refuses it for want of space.
message ClientGrant {
  // The member's process, as the count of its openings it keeps durably: a
  // restart reports a larger value, and the leader takes reports in the
  // order (epoch, seq), never going back to an older one.
  uint64 epoch = 1;

  // The index of the last entry in the member's log when it answered: the
  // room below covers client entries after it.
  uint64 last_index = 2;

  // Bytes held for client entries after `last_index`, by the same measure the
  // leader admits a write by. Never includes the member's recovery reserve.
  uint64 available = 3;

  // The report's place among this process's reports, from 1: a reply that
  // arrives late carries a smaller value and changes nothing.
  uint64 seq = 4;
}

// Empty response for fire-and-forget RPCs.
message RaftEmpty {}
