syntax = "proto3";

package coordinode.v1.session;

import "coordinode/v1/common/types.proto";
import "coordinode/v1/query/cypher.proto";
import "coordinode/v1/replication/cdc.proto";
import "coordinode/v1/replication/consistency.proto";
import "google/rpc/status.proto";

// Multiplexed bidirectional session.
//
// One long-lived bidirectional stream carries many concurrent operations for a
// single client. The client fires a batch of requests into the stream; the
// server executes them concurrently and streams results back as independent
// cursors, tagged by request id, in completion order rather than send order. An
// interactive transaction rides the same session as one interleaved sub-thread
// alongside non-transactional requests, and change-stream subscriptions ride it
// too, delivered in batches within the credit the client grants. The session is
// sticky to the serving node for its lifetime. The unary query, transaction and
// change-stream RPCs remain for clients that cannot hold a stream; this stream
// carries the same messages and is what a driver uses by default.
service SessionService {
  // Open a session. The client sends a stream of ClientFrames (queries and
  // transaction-control operations); the server returns a stream of
  // ServerFrames (cursor chunks and transaction acknowledgements), each tagged
  // with the originating request_id so responses demultiplex out of order.
  rpc Session(stream ClientFrame) returns (stream ServerFrame);
}

// Statement ordering policy for an interactive transaction, fixed at Begin.
enum Ordering {
  // Treated as ORDERING_ORDERED.
  ORDERING_UNSPECIFIED = 0;
  // Each statement carries a per-transaction monotonic nonce. The client
  // numbers the chain and may send frames out of wire order; the server
  // reassembles by nonce in a reorder buffer and applies strictly in nonce
  // order. A failure at nonce K aborts the transaction.
  ORDERING_ORDERED = 1;
  // The client bursts statements without awaiting; the server applies them
  // serially in wire-arrival order. The first failing statement rolls the whole
  // transaction back.
  ORDERING_UNORDERED = 2;
}

// One operation sent by the client on the session stream.
message ClientFrame {
  // Client-assigned, session-scoped correlation id. Every ServerFrame produced
  // for this operation carries the same request_id, so a client demultiplexes
  // concurrent responses and cursor chunks that arrive out of order. The client
  // is responsible for keeping request_ids unique within a live session.
  uint64 request_id = 1;

  // The operation. Exactly one is set.
  oneof op {
    // Run a query statement (autonomous or inside a transaction).
    Execute execute = 2;
    // Open an interactive transaction; the server replies with a Begun(txid).
    Begin begin = 3;
    // Commit an interactive transaction by its txid.
    Commit commit = 4;
    // Roll back an interactive transaction by its txid.
    Rollback rollback = 5;
    // Abort an in-flight request and close its cursor.
    Cancel cancel = 6;
    // Read, and optionally change, this connection's settings. Answered with
    // a ConnectionStatus carrying the settings now in effect.
    Configure configure = 7;
    // Open a change-stream subscription on this session. Answered with
    // Subscribed, then with ChangeEventBatch frames on this request_id as far
    // as the credit granted reaches.
    Subscribe subscribe = 8;
    // Grant a subscription of this session credit for more events.
    Credit credit = 9;
    // Acknowledge a subscription's events, with the same meaning as the
    // change-stream service's AcknowledgeSubscription. Answered with
    // Acknowledged.
    coordinode.v1.replication.AcknowledgeSubscriptionRequest acknowledge = 10;
    // End a consumer's registration, with the same meaning as the
    // change-stream service's CancelSubscription. Answered with
    // SubscriptionCancelled; an open subscription of that incarnation on this
    // session then ends with a CONSUMER_TERMINATED error.
    coordinode.v1.replication.CancelSubscriptionRequest cancel_subscription = 11;
  }
}

// Open a change-stream subscription on the session.
//
// The registration it reads as lives in the shard's consumer registry, not in
// the session: closing the session ends only delivery, and the consumer
// resumes its incarnation from another session or through the change-stream
// service.
message Subscribe {
  // Which consumer to register or resume and where to start, exactly as the
  // change-stream service's Subscribe takes it.
  coordinode.v1.replication.SubscribeRequest request = 1;

  // Events the client can take before its first Credit frame. Zero sends
  // nothing until a Credit arrives.
  uint32 credit = 2;
}

// More credit for a subscription of this session: the server sends that many
// more events on it. Unused credit accumulates; each event sent, a progress
// event included, uses one. A subscription without credit sends nothing and
// holds no part of the session's flow-control window, so it never delays the
// other requests of the session.
message Credit {
  // request_id of the Subscribe frame that opened the subscription.
  uint64 target_request_id = 1;

  // Events added to the subscription's credit. Above zero.
  uint32 events = 2;
}

// Read, and optionally change, the settings this connection applies to
// statements that do not carry their own.
//
// Every field is optional: one that is absent is left as it is, so a client
// changes one setting without restating the others, and a Configure with none
// set is simply a request to report the current status. The server answers
// with a ConnectionStatus whose settings are the ones now in effect, which is
// how a client confirms a change actually took rather than assuming it did.
message Configure {
  // Default read concern for statements that carry none.
  optional coordinode.v1.replication.ReadConcern read_concern = 1;

  // Default write concern for statements that carry none.
  optional coordinode.v1.replication.WriteConcern write_concern = 2;

  // Default read preference for statements that carry none.
  optional coordinode.v1.replication.ReadPreference read_preference = 3;

  // Default reorder-buffer drain timeout, in milliseconds, for transactions
  // opened with ORDERING_ORDERED and no explicit drain_timeout_ms.
  optional uint32 drain_timeout_ms = 4;
}

// Execute one query statement.
message Execute {
  // Query text in the session's dialect (Cypher today; SQL once the SQL
  // frontend lands). The server selects a query frontend per session or per
  // statement and never inspects the syntax above that frontend.
  string query = 1;

  // Named query parameters bound at execution time. Same shape as the unary
  // ExecuteCypherRequest parameters.
  map<string, coordinode.v1.common.PropertyValue> parameters = 2;

  // Interactive transaction handle from a prior Begun. Zero means the statement
  // is autonomous (implicit begin + commit). Non-zero runs the statement inside
  // that transaction: it reads the transaction's pinned snapshot and its writes
  // buffer until Commit.
  uint64 txid = 3;

  // Per-transaction ordering nonce, used only when the transaction was opened
  // with ORDERING_ORDERED. The server applies the transaction's statements in
  // ascending nonce order regardless of wire-arrival order. Ignored for
  // autonomous statements and for ORDERING_UNORDERED transactions.
  uint64 nonce = 4;
}

// Open an interactive transaction.
message Begin {
  // Statement ordering policy for the transaction.
  Ordering ordering = 1;

  // How long (milliseconds) the server's reorder buffer waits for a missing
  // nonce before aborting the transaction, in ORDERING_ORDERED mode. Zero uses
  // the per-session default. Distinct from the idle-reap timeout that closes an
  // untouched transaction.
  uint32 drain_timeout_ms = 2;
}

// Commit an interactive transaction.
message Commit {
  // Transaction handle from a prior Begun.
  uint64 txid = 1;

  // Expected final nonce of the transaction's statement chain, in
  // ORDERING_ORDERED mode, so the server can detect a complete chain before it
  // commits. Zero when unset (UNORDERED transactions, or callers that do not
  // pipeline ahead of the commit).
  uint64 last_nonce = 2;
}

// Roll back an interactive transaction, discarding all buffered writes.
message Rollback {
  // Transaction handle from a prior Begun.
  uint64 txid = 1;
}

// Abort an in-flight request and close its cursor.
message Cancel {
  // request_id of the in-flight request to abort.
  uint64 target_request_id = 1;
}

// One result event sent by the server on the session stream.
message ServerFrame {
  // request_id of the ClientFrame this event answers.
  uint64 request_id = 1;

  // The event. Exactly one is set.
  oneof event {
    // Acknowledges Begin and returns the allocated transaction handle.
    Begun begun = 2;
    // Opens a cursor for a query, carrying the column header.
    CursorOpen cursor_open = 3;
    // A batch of result rows for an open cursor; many may arrive per request.
    RowBatch rows = 4;
    // Closes a cursor, carrying final query statistics.
    CursorEnd cursor_end = 5;
    // Acknowledges Commit, carrying the causal applied-index token.
    Committed committed = 6;
    // Reports an error for the request; terminates its cursor.
    SessionError error = 7;
    // The state of this connection: whether it can serve writes, what it can
    // see of the cluster, and the settings in effect. Sent in answer to a
    // Configure, and unsolicited whenever the state changes.
    ConnectionStatus connection_status = 8;
    // Acknowledges Subscribe, carrying the registration's incarnation.
    Subscribed subscribed = 9;
    // Events of a subscription, in log order, at most the credit left.
    ChangeEventBatch change_events = 10;
    // Acknowledges an acknowledge frame.
    Acknowledged acknowledged = 11;
    // Acknowledges a cancel_subscription frame.
    SubscriptionCancelled subscription_cancelled = 12;
  }
}

// Acknowledges Subscribe.
message Subscribed {
  // Incarnation of the registration the subscription reads as: the one just
  // registered, or the one resumed. Pass it to acknowledge and
  // cancel_subscription.
  uint64 incarnation = 1;
}

// Change events of one subscription, oldest first, as many as were ready and
// the credit allowed. Each event carries its own position, as on the
// change-stream service.
message ChangeEventBatch {
  // The events, each as the change-stream service sends it; a progress event
  // (no ops) lets the client acknowledge past entries its filters dropped.
  repeated coordinode.v1.replication.ChangeEvent events = 1;
}

// Acknowledges an acknowledge frame: the registration now holds the history
// from that position on only.
message Acknowledged {}

// Acknowledges a cancel_subscription frame: the registration has ended.
message SubscriptionCancelled {}

// The state of this connection, from the serving node's point of view.
//
// Sent unsolicited whenever it changes, with request_id zero, because the
// change a client is usually waiting for is one nobody asked about: a node cut
// off from the cluster cannot serve writes, and the client needs to know the
// moment it can again. Holding the session and waiting for that event beats
// retrying on a timer whose interval is a guess about how long an election
// takes. It is also the answer to a Configure, where request_id echoes it.
//
// This describes THIS connection, not the cluster: it is what this node can do
// for this client right now. The cluster-wide picture, with every node's role
// and lag, is an operator's view and lives in the admin service.
message ConnectionStatus {
  // Whether statements that write can be served through this connection right
  // now. True on the leader, and true on a follower that can reach the leader,
  // since a write arriving at a follower is carried there. False when no
  // leader is reachable, which is the condition a waiting client is watching
  // for the end of.
  bool writable = 1;

  // Whether this node has contact with the cluster at all. False on a node
  // that has lost touch with its peers: reads from it still answer, from a
  // snapshot that no longer advances.
  bool connected = 2;

  // The node the cluster last named leader. Unset while an election is in
  // flight or this node cannot tell.
  optional uint64 leader_id = 3;

  // Whether the node serving this connection is itself the leader. A client
  // that wants to avoid the forwarding hop can use this to decide whether to
  // reconnect to the leader named above.
  bool served_by_leader = 4;

  // Raft term this status was observed in. Increases at every election, so a
  // client can tell a genuine leadership change from a repeated report.
  uint64 raft_term = 5;

  // Voting members the cluster is configured with.
  uint32 voters = 6;

  // Voting members this node currently counts as reachable, including itself.
  // Compared against `voters`, this is what "the majority is present" means
  // here, and it is what turns a vague outage into a number an operator and a
  // client can both act on.
  uint32 voters_reachable = 7;

  // The settings in effect for statements that carry none of their own. Echoed
  // whole so a client can confirm a Configure took effect, rather than assume
  // the fields it sent are the ones now applied.
  Configure settings = 8;
}

// Acknowledges Begin.
message Begun {
  // Allocated transaction handle, always non-zero. Pass it as Execute.txid and
  // to Commit / Rollback.
  uint64 txid = 1;
}

// Opens a result cursor.
message CursorOpen {
  // Result column names, in result order.
  repeated string columns = 1;
}

// A batch of result rows for an open cursor. Rows reuse the unary query Row
// message so a session result and a unary result decode identically.
message RowBatch {
  // Result rows, each a list of property values aligned to CursorOpen.columns.
  repeated coordinode.v1.query.Row rows = 1;
}

// Closes a result cursor.
message CursorEnd {
  // Final query statistics for the request. Reuses the unary query stats so the
  // causal applied-index and write counts decode identically.
  coordinode.v1.query.QueryStats stats = 1;
}

// Acknowledges Commit.
message Committed {
  // Raft log index the commit was applied at on the serving node: the causal
  // operationTime token a client passes as after_index on later causal reads.
  // Zero in embedded mode (no Raft cluster).
  uint64 applied_index = 1;

  // HLC commit timestamp (microseconds since the Unix epoch) every mutation of
  // the transaction was applied at. Server-assigned. Equal to the storage
  // sequence number of the write, so it is the exact snapshot anchor:
  // `AS OF TIMESTAMP <commit_ts>` sees this transaction and nothing committed
  // later; a change-stream consumer that has processed it resumes from
  // `commit_ts + 1`. Present in every mode; a read-only transaction reports
  // its pinned read timestamp.
  uint64 commit_ts = 2;
}

// Reports an error for a request.
message SessionError {
  // Stable numeric error code (mirrors the gRPC status taxonomy used elsewhere
  // on the server). Lets a client branch on the failure class without parsing
  // the message text.
  uint32 code = 1;

  // Human-readable error detail for logs and diagnostics. Not a stable contract;
  // branch on code, not on this string.
  string message = 2;

  // The canonical status for the error, with the same typed details (an
  // ErrorInfo with its reason and metadata, a RetryInfo) the matching unary or
  // server-streaming RPC returns in its grpc-status-details-bin trailer. Set
  // for subscription errors (RETENTION_LOST, CONSUMER_TERMINATED, the
  // registry's refusals); a client branches on its ErrorInfo reason.
  google.rpc.Status status = 3;
}
