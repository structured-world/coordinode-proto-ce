syntax = "proto3";

package coordinode.v2.graph;

import "coordinode/v1/common/types.proto";
import "coordinode/v1/query/vector.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

// Schema management: node label and edge type definitions, and the named
// constraints declared over them.
//
// A type definition describes an individual record: property types,
// requiredness, defaults and computed properties. It never declares
// uniqueness. Uniqueness, node keys and the other constraints are separate
// named objects, created and dropped through the constraint RPCs, which share
// one catalog and one admission path with `CREATE CONSTRAINT` / `DROP
// CONSTRAINT` in Cypher: a constraint created here is the same object a query
// sees, and the reverse.
service SchemaService {
  // Create a node label definition. Creating a type never builds an index
  // and never declares a constraint.
  rpc CreateLabel(CreateLabelRequest) returns (Label) {
    option (google.api.http) = {
      post: "/v2/graph/schema/labels"
      body: "*"
    };
  }

  // List the node labels: every declared label definition, and every label
  // that stored nodes carry without a definition.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse) {
    option (google.api.http) = {
      get: "/v2/graph/schema/labels"
    };
  }

  // Create an edge type definition.
  rpc CreateEdgeType(CreateEdgeTypeRequest) returns (EdgeType) {
    option (google.api.http) = {
      post: "/v2/graph/schema/edge-types"
      body: "*"
    };
  }

  // List the edge types: every declared edge type definition, and every edge
  // type that stored edges carry without a definition.
  rpc ListEdgeTypes(ListEdgeTypesRequest) returns (ListEdgeTypesResponse) {
    option (google.api.http) = {
      get: "/v2/graph/schema/edge-types"
    };
  }

  // Create a named constraint. A uniqueness or node-key constraint provisions
  // the index that enforces it: the constraint is published VALIDATING and
  // enforced on every write from then on, and the build validating it against
  // the stored data is admitted as a server-owned operation. The call waits
  // for that build up to the request's `wait`. It returns the constraint
  // ACTIVE once the build published it, or VALIDATING with the build when
  // the wait ran out first; the build then goes on without the call. Stored
  // data that breaks the constraint, or a cancellation, within the wait fails
  // the call with nothing left behind.
  rpc CreateConstraint(CreateConstraintRequest) returns (Constraint) {
    option (google.api.http) = {
      post: "/v2/graph/schema/constraints"
      body: "*"
    };
  }

  // Drop a named constraint, and the index it owns, in one catalog change.
  // The type definition it constrains is left unchanged.
  rpc DropConstraint(DropConstraintRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v2/graph/schema/constraints/{name}"
    };
  }

  // List the named constraints with their state and supporting index.
  rpc ListConstraints(ListConstraintsRequest) returns (ListConstraintsResponse) {
    option (google.api.http) = {
      get: "/v2/graph/schema/constraints"
    };
  }

  // List the index builds this server knows: every build the catalog
  // records, with its state and progress.
  rpc ListIndexBuilds(ListIndexBuildsRequest) returns (ListIndexBuildsResponse) {
    option (google.api.http) = {
      get: "/v2/graph/schema/index-builds"
    };
  }

  // Inspect one index build, after waiting up to the request's `wait` for its
  // outcome. Waiting, or giving up waiting, cancels nothing. An operation no
  // build has fails with NOT_FOUND.
  rpc GetIndexBuild(GetIndexBuildRequest) returns (IndexBuild) {
    option (google.api.http) = {
      get: "/v2/graph/schema/index-builds/{operation}"
    };
  }

  // Cancel an index build. The index it was creating is withdrawn, with the
  // constraint that owns it, in the same catalog change; an index it was
  // rebuilding is kept, failed, and its constraint keeps holding. A build
  // that already has an outcome keeps it: a publication that committed first
  // is never undone. Returns the build as it stands after the call. An
  // operation no build has fails with NOT_FOUND.
  rpc CancelIndexBuild(CancelIndexBuildRequest) returns (IndexBuild) {
    option (google.api.http) = {
      post: "/v2/graph/schema/index-builds/{operation}/cancel"
      body: "*"
    };
  }

  // List the duplicates a build with ON DUPLICATE RENAME repaired: the
  // node, the property and the value replaced by which. An operation no
  // build has fails with NOT_FOUND.
  rpc ListIndexBuildRepairs(ListIndexBuildRepairsRequest) returns (ListIndexBuildRepairsResponse) {
    option (google.api.http) = {
      get: "/v2/graph/schema/index-builds/{operation}/repairs"
    };
  }
}

// The scalar property types: types that take no parameters.
enum ScalarType {
  // Not a type. Refused when a type is required.
  SCALAR_TYPE_UNSPECIFIED = 0;
  // UTF-8 text.
  SCALAR_TYPE_STRING = 1;
  // Signed 64-bit integer.
  SCALAR_TYPE_INT64 = 2;
  // IEEE 754 binary64 floating point number.
  SCALAR_TYPE_FLOAT64 = 3;
  // Boolean.
  SCALAR_TYPE_BOOL = 4;
  // Point in time.
  SCALAR_TYPE_TIMESTAMP = 5;
  // Large binary object stored apart from the record and read by reference.
  SCALAR_TYPE_BLOB = 6;
  // Binary value stored inline in the record.
  SCALAR_TYPE_BINARY = 7;
  // Map of string keys to values.
  SCALAR_TYPE_MAP = 8;
  // Geographic point or shape.
  SCALAR_TYPE_GEO = 9;
  // Arbitrary nested document; its content is not type-checked.
  SCALAR_TYPE_DOCUMENT = 10;
}

// A dense vector type.
message VectorType {
  // Number of coordinates every value must have, from 1 to 65536. Zero
  // declares no fixed length: values of any length are accepted, and a vector
  // index takes its dimensions from its own definition.
  uint32 dimensions = 1;
  // Distance metric the property is compared by. UNSPECIFIED means COSINE.
  coordinode.v1.query.DistanceMetric metric = 2;
}

// A homogeneous array type.
message ArrayType {
  // The type of every element. Required.
  PropertyType element = 1;
}

// The declared type of a stored property.
message PropertyType {
  // Exactly one is set; a type with none set is refused.
  oneof type {
    // A type without parameters.
    ScalarType scalar = 1;
    // A dense vector with its dimensions and metric.
    VectorType vector = 2;
    // An array of elements of one type.
    ArrayType array = 3;
  }
}

// A stored property of a label or edge type. Carries the type facts of one
// property only; whether its values are unique is a constraint, listed by
// ListConstraints.
message PropertyDefinition {
  // Property name, unique within the label or edge type. Case-sensitive.
  string name = 1;
  // Declared type of the property's values. Required.
  PropertyType type = 2;
  // Whether every record must carry a non-null value. A write without one is
  // refused.
  bool required = 3;
  // Value a record reads when it does not carry the property. Unset: no
  // default, and a missing property reads as null.
  coordinode.v1.common.PropertyValue default_value = 4;
}

// The kind of COMPUTED property.
enum ComputedType {
  // Not a kind. Refused.
  COMPUTED_TYPE_UNSPECIFIED = 0;
  // The node, or part of it, is deleted once duration_secs has elapsed since
  // the anchor_field timestamp; `scope` says which part.
  COMPUTED_TYPE_TTL = 1;
  // Value interpolated from `initial` to `target` over duration_secs,
  // evaluated when read: initial + (target - initial) * formula(elapsed).
  COMPUTED_TYPE_DECAY = 2;
  // Multiplier in [0, 1] that a vector similarity score is scaled by when
  // read, from the formula over the time elapsed since anchor_field.
  COMPUTED_TYPE_VECTOR_DECAY = 3;
}

// Decay formula of a DECAY or VECTOR_DECAY computed property. Every formula
// maps normalized time t in [0, 1] to a weight in [0, 1].
enum DecayFormulaType {
  // LINEAR.
  DECAY_FORMULA_TYPE_UNSPECIFIED = 0;
  // f(t) = max(0, 1 - t): constant rate, zero at the end of the duration.
  DECAY_FORMULA_TYPE_LINEAR = 1;
  // f(t) = e^(-lambda * t). Requires `lambda`.
  DECAY_FORMULA_TYPE_EXPONENTIAL = 2;
  // f(t) = (1 + t / tau)^(-alpha): fast early decay with a long tail.
  // Requires `tau` and `alpha`.
  DECAY_FORMULA_TYPE_POWER_LAW = 3;
  // f(t) = 1 while t < 1, then 0.
  DECAY_FORMULA_TYPE_STEP = 4;
}

// What a TTL computed property deletes when it expires.
enum TtlScopeType {
  // NODE.
  TTL_SCOPE_TYPE_UNSPECIFIED = 0;
  // Only the anchor_field property; the node remains.
  TTL_SCOPE_TYPE_FIELD = 1;
  // Only the DOCUMENT property named by target_field; the anchor_field
  // timestamp remains.
  TTL_SCOPE_TYPE_SUBTREE = 2;
  // The whole node with all its edges.
  TTL_SCOPE_TYPE_NODE = 3;
}

// A COMPUTED property of a label: evaluated from each node's data, stored
// once in the label definition and never per node. Read-only; a write to it
// is refused.
message ComputedPropertyDefinition {
  // Property name, unique within the label and distinct from every stored
  // property name.
  string name = 1;
  // Kind of computed property. Required.
  ComputedType computed_type = 2;
  // Decay formula, for DECAY and VECTOR_DECAY. Ignored for TTL.
  DecayFormulaType formula_type = 3;
  // EXPONENTIAL rate, lambda = ln(2) / half_life_fraction, where
  // half_life_fraction is the half-life as a fraction of duration_secs.
  double lambda = 4;
  // POWER_LAW time scale as a fraction of the duration, greater than 0.
  double tau = 5;
  // POWER_LAW exponent, greater than 0.
  double alpha = 6;
  // DECAY value at elapsed = 0.
  double initial = 7;
  // DECAY value once elapsed >= duration_secs.
  double target = 8;
  // Length of the decay, or the TTL, in seconds. Greater than 0.
  uint64 duration_secs = 9;
  // Name of the TIMESTAMP property elapsed time is measured from. Required;
  // must be a stored TIMESTAMP property of the same label.
  string anchor_field = 10;
  // TTL only: what expiry deletes.
  TtlScopeType scope = 11;
  // TTL with scope SUBTREE only: the DOCUMENT property expiry deletes. Empty
  // otherwise.
  string target_field = 12;
}

// How a label validates and stores the properties of its nodes.
enum SchemaMode {
  // STRICT.
  SCHEMA_MODE_UNSPECIFIED = 0;
  // Only declared properties are accepted; a write with any other is refused.
  // Property names are interned, the most compact form.
  SCHEMA_MODE_STRICT = 1;
  // Declared properties are type-checked and interned; other properties are
  // accepted unchecked and stored by name.
  SCHEMA_MODE_VALIDATED = 2;
  // No property is checked against the definition beyond requiredness and
  // defaults; every property is stored by name.
  SCHEMA_MODE_FLEXIBLE = 3;
}

// A node label as the catalog holds it.
message Label {
  // Label name. Case-sensitive.
  string name = 1;
  // False for a label stored nodes carry without a definition; every other
  // field is then empty.
  bool declared = 2;
  // Stored properties, by name.
  repeated PropertyDefinition properties = 3;
  // Computed properties, by name.
  repeated ComputedPropertyDefinition computed_properties = 4;
  // How the label validates and stores properties.
  SchemaMode schema_mode = 5;
  // Whether nodes of the label carry a valid-time interval and keep one
  // version per interval start. Fixed when the label is created.
  bool temporal = 6;
  // Revision of the definition. Every published change of the definition or
  // of the label's constraints advances it; a published revision never
  // changes.
  uint64 schema_revision = 7;
}

// An edge type as the catalog holds it.
message EdgeType {
  // Edge type name. Case-sensitive.
  string name = 1;
  // False for an edge type stored edges carry without a definition; every
  // other field is then empty.
  bool declared = 2;
  // Stored properties, by name.
  repeated PropertyDefinition properties = 3;
  // Whether edges of the type carry a valid-time interval.
  bool temporal = 4;
  // Revision of the definition. See `Label.schema_revision`.
  uint64 schema_revision = 5;
}

message CreateLabelRequest {
  // Label name, for example "User". Case-sensitive. A label that already has
  // a definition is refused.
  string name = 1;
  // Stored properties. Names are unique within the request.
  repeated PropertyDefinition properties = 2;
  // Computed properties. Names are unique and distinct from the stored ones.
  repeated ComputedPropertyDefinition computed_properties = 3;
  // How the label validates and stores properties.
  SchemaMode schema_mode = 4;
  // Whether nodes of the label are bitemporal. Cannot be changed later.
  bool temporal = 5;
}

message ListLabelsRequest {}

message ListLabelsResponse {
  // Every label, ordered by name.
  repeated Label labels = 1;
}

message CreateEdgeTypeRequest {
  // Edge type name, for example "FOLLOWS". Case-sensitive. An edge type that
  // already has a definition is refused.
  string name = 1;
  // Stored properties. Names are unique within the request.
  repeated PropertyDefinition properties = 2;
  // Whether edges of the type are temporal. Cannot be changed later.
  bool temporal = 3;
}

message ListEdgeTypesRequest {}

message ListEdgeTypesResponse {
  // Every edge type, ordered by name.
  repeated EdgeType edge_types = 1;
}

// What a constraint requires of the properties it names.
enum ConstraintKind {
  // Not a kind. Refused.
  CONSTRAINT_KIND_UNSPECIFIED = 0;
  // No two nodes of the label share the values of the properties. A node
  // missing any of them is not constrained.
  CONSTRAINT_KIND_UNIQUE = 1;
  // The one named property is present and not null on every node.
  CONSTRAINT_KIND_NOT_NULL = 2;
  // Every named property is present and not null, and no two nodes share
  // their values.
  CONSTRAINT_KIND_NODE_KEY = 3;
  // A present, non-null value of the one named property has the constraint's
  // property_type.
  CONSTRAINT_KIND_PROPERTY_TYPE = 4;
}

// Where a constraint is in its life.
enum ConstraintState {
  // Never sent.
  CONSTRAINT_STATE_UNSPECIFIED = 0;
  // Enforced on every write while its index is still being checked against
  // the stored data: the guarantee over data stored before it is not
  // established yet. The check is the index build named in `Constraint.build`;
  // its outcome makes the constraint ACTIVE or withdraws it. A build a
  // restart or a change of leader interrupted is taken up again.
  CONSTRAINT_STATE_VALIDATING = 1;
  // Checked against the stored data and enforced on every write.
  CONSTRAINT_STATE_ACTIVE = 2;
}

// A named constraint as the catalog holds it.
message Constraint {
  // Constraint name, unique in the database.
  string name = 1;
  // What the constraint applies to.
  oneof target {
    // The nodes whose label is this one.
    string label = 2;
  }
  // The constrained properties, in declaration order; the order is the
  // column order of the supporting index.
  repeated string properties = 3;
  // What the constraint requires.
  ConstraintKind kind = 4;
  // The required type, for kind PROPERTY_TYPE; unset for every other kind.
  PropertyType property_type = 5;
  // Where the constraint is in its life.
  ConstraintState state = 6;
  // Name of the index the constraint owns and is enforced through, for
  // UNIQUE and NODE_KEY; empty for the kinds checked on each node alone. The
  // index is dropped with the constraint and cannot be dropped on its own.
  string backing_index = 7;
  // The build of the backing index, for UNIQUE and NODE_KEY: while the
  // constraint is VALIDATING, the operation deciding whether it becomes
  // ACTIVE. Unset for the kinds checked on each node alone.
  IndexBuild build = 8;
  // For UNIQUE, the nodes the uniqueness holds among: only nodes the
  // predicate admits are compared, and the backing index holds only them.
  // Unset: every node of the label.
  ConstraintScope scope = 9;
}

// The predicate that scopes a UNIQUE constraint: a test of one property of
// a node. A partial unique index (`CREATE UNIQUE INDEX ... WHERE`) declares
// a uniqueness with its predicate as the scope.
message ConstraintScope {
  // The property the predicate tests. Required.
  string property = 1;
  // What the property must be for the node to be in scope. Exactly one.
  oneof test {
    // The property equals this string.
    string equals_string = 2;
    // The property equals this integer.
    int64 equals_int = 3;
    // The property equals this boolean.
    bool equals_bool = 4;
    // The property is present and not null.
    google.protobuf.Empty present = 5;
  }
}

message CreateConstraintRequest {
  // Constraint name, unique in the database. Empty: the server derives one
  // and returns it.
  string name = 1;
  // What the constraint applies to. Required.
  oneof target {
    // The label whose nodes are constrained.
    string label = 2;
  }
  // The constrained properties, in order. NOT_NULL and PROPERTY_TYPE take
  // exactly one; UNIQUE and NODE_KEY take one or more, with no repeats.
  repeated string properties = 3;
  // What the constraint requires. Required.
  ConstraintKind kind = 4;
  // The required type, for kind PROPERTY_TYPE; must be unset for any other
  // kind.
  PropertyType property_type = 5;
  // When true, a constraint of the same name, or one requiring the same of
  // the same properties of the same label, already in place makes the call
  // succeed and return that constraint, VALIDATING with its running build
  // included: a retry after a lost reply finds the build the first call
  // admitted rather than admitting a second. When false, either is refused.
  bool if_not_exists = 6;
  // How long the call waits for the build of the backing index. Unset: the
  // server's default (`index_build_statement_wait_secs`). Zero: the call
  // returns once the constraint and its build are admitted. Ignored for the
  // kinds checked on each node alone, which have no build.
  google.protobuf.Duration wait = 7;
  // UNIQUE and NODE_KEY only: a string property among `properties` the build
  // may change to end a duplicate it finds in the stored data, by appending
  // a random suffix to one holder's value (`ON DUPLICATE RENAME`). Each
  // repair commits as its own transaction, is visible at once, and is kept
  // whatever the build's outcome. Empty: the build fails on the first
  // duplicate. Later writes are refused as duplicates as always.
  string on_duplicate_rename = 8;
  // UNIQUE only: the nodes the uniqueness holds among. Unset: every node of
  // the label. Two constraints over the same properties with different
  // scopes are different constraints.
  ConstraintScope scope = 9;
}

message DropConstraintRequest {
  // Name of the constraint to drop.
  string name = 1;
  // When true, a missing constraint makes the call succeed. When false, it is
  // refused.
  bool if_exists = 2;
}

message ListConstraintsRequest {}

message ListConstraintsResponse {
  // Every constraint, ordered by name.
  repeated Constraint constraints = 1;
}

// Where an index build stands.
enum IndexBuildState {
  // Never sent.
  INDEX_BUILD_STATE_UNSPECIFIED = 0;
  // Admitted with its index; no executor has taken it yet.
  INDEX_BUILD_STATE_ACCEPTED = 1;
  // An executor is filling the index; `phase` says where.
  INDEX_BUILD_STATE_RUNNING = 2;
  // The index was published ready, and a constraint owning it made ACTIVE.
  INDEX_BUILD_STATE_PUBLISHED = 3;
  // The stored data refused the index; `failure` says why. A new index was
  // withdrawn with the constraint owning it; a rebuilt one is kept, failed.
  INDEX_BUILD_STATE_FAILED = 4;
  // Cancelled before it had an outcome; the same withdrawal as FAILED.
  INDEX_BUILD_STATE_CANCELLED = 5;
}

// Where a RUNNING build stands on the executor holding it.
enum IndexBuildPhase {
  // Not running on an executor of this server.
  INDEX_BUILD_PHASE_UNSPECIFIED = 0;
  // Waiting for a seat: as many builds as the server runs at once
  // (`index_build_max_running`) are filling indexes.
  INDEX_BUILD_PHASE_AWAITING_SEAT = 1;
  // Waiting for the transactions opened before the index existed to end.
  INDEX_BUILD_PHASE_AWAITING_OLDER_TRANSACTIONS = 2;
  // Filling the index.
  INDEX_BUILD_PHASE_INDEXING = 3;
}

// An index build: the server-owned operation that fills one index and
// publishes it, independent of the request, connection or member that
// admitted it.
message IndexBuild {
  // Identity of the build, assigned when it is admitted and never reused.
  // Inspected with GetIndexBuild, cancelled with CancelIndexBuild.
  uint64 operation = 1;
  // Name of the index the build fills. Empty once the index is withdrawn.
  string index = 2;
  // Label whose nodes the index covers. Empty once the index is withdrawn.
  string label = 3;
  // Where the build stands.
  IndexBuildState state = 4;
  // Where a RUNNING build stands on the executor of this server holding it;
  // UNSPECIFIED when none does.
  IndexBuildPhase phase = 5;
  // Nodes indexed so far. Progress, not proof of coverage.
  uint64 indexed = 6;
  // Why the build failed, for FAILED; empty otherwise.
  string failure = 7;
  // The property the build may change to repair a duplicate; empty for a
  // build that fails on the first one.
  string rename_property = 8;
  // Repairs the build has committed so far. Each changed a node's value
  // and is listed by ListIndexBuildRepairs; none is undone by a cancellation
  // or a failure of the build.
  uint64 repaired = 9;
}

// One duplicate a build repaired: the value of `property` it replaced on a
// node.
message IndexBuildRepair {
  // The node it changed, as an element id.
  string element_id = 1;
  // The property it changed.
  string property = 2;
  // The value the node held, which another node held too.
  string old_value = 3;
  // The value the node holds since the repair.
  string new_value = 4;
}

message ListIndexBuildRepairsRequest {
  // The build whose repairs to list. Required: an absent operation is
  // refused, never read as operation 0.
  optional uint64 operation = 1;
}

message ListIndexBuildRepairsResponse {
  // Every repair the build committed, ordered by node.
  repeated IndexBuildRepair repairs = 1;
}

message ListIndexBuildsRequest {}

message ListIndexBuildsResponse {
  // Every build, ordered by operation.
  repeated IndexBuild builds = 1;
}

message GetIndexBuildRequest {
  // The build to inspect. Required: an absent operation is refused, never
  // read as operation 0.
  optional uint64 operation = 1;
  // How long to wait for the build to reach an outcome before answering.
  // Unset or zero: answer at once.
  google.protobuf.Duration wait = 2;
}

message CancelIndexBuildRequest {
  // The build to cancel. Required: an absent operation is refused, never
  // read as operation 0.
  optional uint64 operation = 1;
}
